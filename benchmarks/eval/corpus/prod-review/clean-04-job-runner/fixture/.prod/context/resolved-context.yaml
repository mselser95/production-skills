# resolved-context.yaml
task: Run a list of jobs on a bounded worker pool that stops on the first error or when the caller's context ends.
tier: 2
services: [jobs]

capabilities:
  touched: []
  obligations: []

invariants: []

required_evidence:
  gates: [go build ./..., go vet ./..., go test ./...]
  signals: [test results]

constraints:
  - standard library only; no new module dependencies
  - exported API stays source-compatible for existing callers

do_not_touch:
  - verification/ratified/**
  - .prod/**
  - production.yaml
