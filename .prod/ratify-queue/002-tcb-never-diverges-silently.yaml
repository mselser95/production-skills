invariant: the-installed-tcb-never-diverges-from-source-silently
status: RATIFIED
ratified_by: mselser95
ratified_on: '2026-08-31'
test: verification/ratified/inv-002-tcb-never-diverges-silently.sh

statement: >
  The skills installed in ${CLAUDE_CONFIG_DIR}/skills must never differ from
  this repo's source without install.sh --verify saying so and naming the files.
  Both directions count: a tampered installed copy (drift) and an installed copy
  older than source (staleness).

why_this_one: >
  The installed copy is what actually runs. On 2026-08-29 two SKILL.md files
  were committed here and never reinstalled, so every session loaded the older
  text while the repo looked current -- caught only because the staleness branch
  exists. Integrity and currency are different questions and only the first had
  a check until that day.

evidence:
  fail_closed_sites:
    - "install.sh: TCB DRIFT branch, which diffs the manifest and names every path"
    - "install.sh: STALE INSTALL branch, which names each stale file"
    - ".githooks/pre-commit: refuses a commit when the maintenance gates fail"

non_vacuity_check:
  file: 'install.sh'
  expect_red: 'verification/ratified/inv-002-tcb-never-diverges-silently.sh'
  find: 'the `if (( wcount > 0 ))` TCB WRITABLE block'
  replace: 'deleted'
  note: >
    Verified 2026-08-31. With the writable-detection branch removed (syntax confirmed
    still valid), inv-002 reported `FAIL a writable trusted set is caught, named --
    rc=0 want=3`, 4 ok / 1 failed, and returned to 5 ok on revert. The test
    asserts all three divergences AND that each NAMES the file, because a count
    cannot be acted on.
