task: 'verify-standard.sh probe 19 (candidate-lane-segregated) compares COUNTS of two unrelated file sets
  (candidate-headed files vs go:build candidate files) and its header regex ignores ''provenance: candidate
  (TTL: 90d)'' and ''provenance: candidate, ttl ...'' headers, so candidate tests living in the blocking
  lane pass it. Probes replay-corpus and observability-contract-checked hide the failing test output.
  Fix the probes in _shared/probes/verify-standard.sh and its vendored copy prod-new/template/scripts/verify-standard.sh,
  with selftests proving each can fail. Requested by Mati 2026-10-06 (''arregla production skills'').'
tier: 1
services:
- production-skills
capabilities:
  touched:
  - id: verify-standard-probes
    class: external_read
    declared: existing
invariants:
- all ratified invariants of this repo apply unchanged
required_evidence:
  gates:
  - make selftests
  - make verify
  signals:
  - a new selftest is RED on the pre-fix probe (count-vacuous fixture) and GREEN after
  - template digest regenerated in the same commit
constraints:
- 'AGENTS.md: never modify or delete an existing test to make a change pass; new tests carry provenance
  headers'
- the canonical and vendored copies of verify-standard.sh stay identical
- TEMPLATE-DIGEST regenerated by scripts/template-digest.sh --write
do_not_touch:
- verification/ratified/**
- registries rules
- CI configuration
approval:
  approved_by: n/a (tier 1)
  date: '2026-10-06'
