# postgresql.timescale.conf — the Timescale variant: the base file plus the
# extension's preload library. Later settings win, so this file only overrides.
include '/etc/postgresql/postgresql.conf'

# timescaledb first (its documented position), then the statistics extension.
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.telemetry_level = off
