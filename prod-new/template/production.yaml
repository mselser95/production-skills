# production.yaml — this repo's production contract.
#
# This file declares SEMANTIC FACTS ONLY. Every threshold, obligation and
# scenario list is DERIVED from the org tier policy
# (production-skills _shared/tier-policy.yaml) -- if you are looking for a
# coverage number or a failure-mode checklist here, it belongs there, not in
# this file. <OWNER>/<SERVICE> are slots prod-new substitutes at scaffold
# time; every semantic value below is a real, working example a new service
# replaces with its own answers to the four questions (prod-new's Phase 1).

version: v1

service:
  name: <SERVICE>
  tier: 1
  tier_note: >
    Example tier for the scaffold's own units-ledger capability: T1
    (data-correctness invariants keep the T0 invariant-flake rule -- a
    nondeterministic failure in verification/ratified is an incident, never
    a quarantine -- even though nothing here is irreversible-external-effect
    T0 by itself). A real service replaces this with its own ratified
    answer to prod-new's Phase 1 question 2.
  policy: production-skills (single source, main)

invariants:                         # ratified -- resolve to verification/ratified/
  - units_conserved
  - duplicate_event_single_effect

capabilities:
  - id: units_notification
    class: external_effect
    package: internal/adapter/out/store
    verified:
      outbox_journal_then_deliver_then_mark: internal/adapter/out/store TestOutbox_JournalThenPublish_MarksDelivered
      idempotency_key_stable_across_retries: TestOutbox_Publish_ReusesTheSameIdempotencyKeyAcrossRetries
      durable_intent_survives_restart: TestOutbox_DurableIntentSurvivesARestartAndResumesUnderTheSameKey (store.OpenDurable replays internal/platform/outboxlog at boot)
      journal_refuses_unencodable_effect: TestOutbox_JournalRefusesAnUnencodableEffect (an intent a restart could not replay is never accepted)
      idempotency_key_stable_across_publish_invocations: TestOutbox_IdempotencyKeyIsStableAcrossPublishInvocations (the key belongs to the ENTRY, so a Reconcile pass re-delivers under the SAME key rather than re-keying)
      max_attempts_never_retries_forever: TestOutbox_Publish_ExhaustsMaxAttemptsAndMarksFailed
      reconciliation_resumes_pending_entries: TestOutbox_Reconcile_ResumesPendingEntries
      conformance_kit: TestOutbox_PassesExternalEffectConformanceKit (verification/conformance.ExternalEffectKit)
    assumed:
      fsync_reaches_stable_storage:
        detector: >
          NOT VERIFIED HERE. internal/platform/outboxlog fsyncs every record
          before Append returns, but removing that Sync call STAYED GREEN
          under mutation on 2026-08-18: no in-process test can distinguish
          fsync from no-fsync, because a normally-exiting process flushes its
          writes anyway. Durability against a MACHINE kill is therefore
          assumed, not proven. The line carries a NO TEST GUARDS THIS LINE
          marker and registries/contract-debt.yaml holds the owned, expiring
          entry for the docker-kill test that would close it.
      sink_receiver_dedups_by_idempotency_key:
        detector: internal/adapter/out/store's own ackLostOnceSink test double
          proves the CONTRACT this assumption depends on; a real Sink
          implementation (this template ships LogSink, a working
          demonstration) must honor the same idempotency-key contract for
          the assumption to hold in production.

  - id: units_ledger
    class: source_of_truth
    durability: durable (append-only local file, internal/platform/eventlog)
    package: internal/domain, internal/app
    verified:
      conservation: verification/ratified/invariants_test.go TestInvariant_UnitsConserved
      idempotency: verification/ratified/invariants_test.go TestInvariant_DuplicateEventAppliedOnce
      recovery_rebuild_from_log: internal/platform/eventlog TestAppendAndReplay_RoundTrips + internal/e2e (integration tag) TestSvc_RealEventLogAndRealTCP_DepositAndWithdrawSurviveARestart
      state_machine_recovery_semantics: internal/app/ledger.go's commandState doc (csReceived -> csLogged -> csApplied -> csEffectsJournaled -> csCommitted)
      conformance_kit: internal/app TestLedger_PassesSourceOfTruthConformanceKit (verification/conformance.SourceOfTruthKit; serialization_conflict exercised for real under -race, the rest skipped with documented reasons -- see production.yaml's out_of_scope for the storage-choice framing)
    semantics:
      consistency: single-writer, immediately consistent (internal/app.Ledger
        holds one in-memory domain.State guarded by its own mutex; no
        concurrent-writer conflict resolution exists or is needed at this
        scale)

  - id: health_metrics_surface
    class: external_read
    package: internal/adapter/in/healthhttp
    verified:
      conformance_kit: internal/adapter/in/healthhttp TestServer_PassesExternalReadConformanceKit (verification/conformance.ExternalReadKit; stale_data and unavailable exercised for real, the rest skipped with documented reasons -- this is a driving adapter reporting internal state, not a client of an external feed)
      observability_contract_checked: TestMetricsContract_ScrapeMatchesManifestBothDirections
    semantics:
      contract: observability/emitted-metrics.yaml (series) +
        observability/spans.yaml (spans)
      readiness: multi-gate -- durable-log-writable AND
        no-recent-invariant-violation (cooldown-gated, evaluated via the
        ReadinessAt(now) seam); a missing gate is reported, never silently
        assumed satisfied

# Ratified declines. Each is a recorded decision with its reason -- never a
# silent omission.
out_of_scope:
  - backup_restore_test: >
      This scaffold's only durable store is a local append-only file
      (internal/platform/eventlog) -- there is no managed backup/restore
      infrastructure (no object-store snapshot, no PITR) to test against in
      a template. A real deployment's storage choice (a managed volume with
      its own backup policy, or a durable log shipped to object storage)
      determines what a real backup_restore_test looks like; that choice is
      deployment-specific, not something this scaffold can decide.
  - authz_invariants: >
      No tenants and no credentials exist in this scaffold's example flow;
      the units ledger has no multi-tenant boundary to enforce.

# Unmet REQUIRED obligations do NOT live here. They are waivers with owners
# and expiries in registries/waivers.yaml, enforced by
# scripts/check-registries.sh -- a spec key invented to hold them would be
# the exact escape the framework forbids.

gates:
  cheap: "make check-fast"
  presubmit: "make verify"
  advisory: "make test-advisory"

# Dimensions the probe checks by EXECUTING the test named here (see
# scripts/verify-standard.sh). A dimension listed here is implemented and
# proven, not declined.
implemented:
  effect_journal_outbox: ./internal/adapter/out/store TestOutbox_DurableIntentSurvivesARestartAndResumesUnderTheSameKey
