name: CI
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/retry.sh go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make verify
      # PROVE THE VERIFIER BEFORE TRUSTING ITS VERDICT — same step as pr.yaml's
      # check-fast job, and here because `make verify` does not run the probe
      # selftests. Listed individually rather than globbed: a `for f in
      # scripts/tests/*-selftest.sh` loop reports success over an empty glob.
      - name: probe selftests (the verifier of the verifier)
        # ONE LIST, not three. This step used to restate the five scripts
        # that `make probe-selftests` already names, and so did ci.yaml --
        # three copies that had to agree. The pre-commit hook in the framework
        # repo records the rule this breaks: "two lists that must agree are one
        # list and one latent defect". Measured 2026-08-29: the Makefile target
        # was referenced by NOTHING (not verify, not check-fast, no workflow,
        # no doc), and while it sat uninvoked it went RED -- 10 failing cases
        # across sbom-ordering and check-registries, both from probe changes
        # that never updated their selftests. The duplicate lists are why the
        # target could rot unnoticed: CI ran the scripts, so nobody missed the
        # target, and the target was where the list lived.
        #
        # Still explicit, never a glob: the Makefile names all five, so a
        # renamed directory breaks the build instead of reporting success over
        # an empty glob.
        run: make probe-selftests

  # Secret scanning on EVERY trigger, not just PR --
  # tier-policy.yaml: supply_chain.secret_scan = all_triggers. This is the
  # push-triggered half; pr.yaml's own secret-scan job is the PR half.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is what makes this scan mean anything. The default is
      # depth 1, so `gitleaks detect` would scan ONE commit and report clean --
      # a scan whose denominator is a single commit is the zero-inputs shape
      # wearing a green check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # THE PINNED BINARY, NOT `gitleaks/gitleaks-action@v2`.
      #
      # This template shipped the ACTION until 2026-09-14. The action requires
      # a paid licence on any ORGANISATION repo and exits before scanning
      # anything without one:
      #
      #     [<org>] is an organization. License key is required.
      #
      # So every repo scaffolded from this template into an org got a
      # secret-scanning gate that had never scanned a single commit -- and
      # because it fails CLOSED, its red is indistinguishable from a real
      # finding, which is precisely the signal it exists to carry. Measured on
      # a scaffolded repo: red on every push for the life of the repo, and the
      # first time anyone read the log it turned out nothing had been scanned.
      #
      # The gitleaks CLI itself is MIT and needs no licence. Installed from
      # `github.com/zricethezav/gitleaks` -- the module path the tool declares.
      # `github.com/gitleaks/...` is the repo URL and `go install` rejects it
      # with "module declares its path as", which is the kind of failure that
      # gets a security step commented out at 6pm.
      #
      # Known findings belong in a `.gitleaksignore` at the repo root, pinned
      # BY FINGERPRINT (`commit:file:rule:line`) with the remediation written
      # beside each. Never mute a path or a rule: a fingerprint names one
      # finding in one immutable commit and cannot widen, while a muted rule
      # blinds the scanner to every future secret of that kind.
      #
      # When proving this non-vacuous, do NOT plant AWS's documentation keys
      # (AKIAIOSFODNN7EXAMPLE and friends) -- gitleaks allowlists exactly
      # those, so it reports clean and the proof proves nothing. Use a
      # non-allowlisted random key plus an RSA private-key block.
      - name: secret scanning (blocking)
        run: |
          bash scripts/retry.sh go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner --redact --exit-code 1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/retry.sh go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  docker-build:
    needs: [production-gates]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          push: false
          load: true
          tags: svc:${{ github.sha }}
          outputs: type=docker,dest=/tmp/svc-image.tar

  sbom:
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - run: syft dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90
