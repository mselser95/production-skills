# Checked-in manifest of every Prometheus series this service emits.
#
# Contract: this file is the source of truth internal/adapter/in/healthhttp's
# TestMetricsContract_ScrapeMatchesManifestBothDirections diffs the REAL
# /metrics scrape against, in both directions. Adding a metric to the code
# without a matching entry here fails that test -- so keep this in lockstep
# with internal/adapter/in/healthhttp/health.go's MetricNames().
#
# Fields:
#   name   - the Prometheus series name (exactly as emitted)
#   type   - counter | gauge
#   labels - closed label set, [] if none
#   note   - anything an alert-rule author needs to know

- name: svc_build_info
  type: gauge
  labels: [revision, config_digest]
  note: >
    Standard Prometheus build_info convention: the value is ALWAYS 1 and the
    whole signal lives in the labels. `revision` is the git SHA this binary
    was built from (internal/platform/buildinfo); `config_digest` is
    Config.Digest(), a fingerprint of this pod's entire resolved config
    (internal/platform/config.Config.Digest). Both are bounded by DEPLOY --
    one distinct value per running process -- so this can never become a
    cardinality source.

- name: svc_units_conserved_violations_total
  type: counter
  labels: []
  note: >
    Ratified invariant units_conserved
    (verification/ratified/invariants_test.go). Must stay 0 in production;
    internal/app.Ledger's checkInvariants runs domain.ConservationHolds
    after every command and increments this the instant it disagrees with
    what actually happened. See internal/app/ledger_invariants_test.go for
    the deliberate-violation proof that this counter is wired to something
    that can fire.

- name: svc_duplicate_event_violations_total
  type: counter
  labels: []
  note: >
    Ratified invariant duplicate_event_single_effect
    (verification/ratified/invariants_test.go). Must stay 0 in production --
    domain.Apply's own idempotency-by-ID guard is what keeps a legitimate
    duplicate submission from ever incrementing this.

- name: svc_readyz_stale_never_ready_audits_total
  type: counter
  labels: []
  note: >
    Runtime self-audit of /readyz's own gate formula
    (internal/adapter/in/healthhttp/invariant_counters.go). Must stay 0 --
    ReadinessAt's `ready := logOK && violationOK` can never disagree with
    itself in real operation; this exists so the audit is proven wired
    rather than dead code (see invariant_counters_test.go).

- name: svc_eventlog_writable
  type: gauge
  labels: []
  note: >
    1 if the durable event log (internal/platform/eventlog.Log) is
    currently open for writing, 0 otherwise. Mirrors the `log_writable`
    readiness gate.

# ---------------------------------------------------------------------------
# OUTBOX DRAIN HEALTH. The outbox bounds what it holds, and dead-letters what
# crosses those bounds. Without these series that dead-letter store is durable,
# countable and completely invisible from outside the process -- a deletion
# with extra steps.
# ---------------------------------------------------------------------------

- name: svc_outbox_pending_entries
  type: gauge
  labels: []
  note: >
    Effects journaled but not yet delivered. Rising is NORMAL during a brief
    sink outage and says nothing on its own -- what matters is whether it
    DRAINS. Alert on svc_outbox_oldest_pending_age_seconds instead; a count
    that climbs and falls is the pattern working.

- name: svc_outbox_oldest_pending_age_seconds
  type: gauge
  labels: []
  note: >
    Age of the oldest pending entry, and the series worth paging on. The
    asymmetry is the reason: a lost SUBMIT fails safe (the effect never
    happened and nobody believes it did), while a lost PUBLISH does not -- the
    state committed durably and the notification never left, with no other
    signal that would notice.
    Entries whose age is unknown are excluded here and counted in
    svc_outbox_unknown_age_entries, so this series only ever reports ages it
    actually knows.

- name: svc_outbox_unknown_age_entries
  type: gauge
  labels: []
  note: >
    Pending entries restored from a schema-1 durable record, written before
    the journaling timestamp existed. Their age is genuinely UNKNOWN rather
    than zero. Counted separately on purpose: "nothing here is old" and "I
    cannot tell you whether anything here is old" support opposite decisions,
    and folding the second into the first would let a long-stuck effect read
    as fresh.

- name: svc_outbox_dead_lettered_total
  type: gauge
  labels: []
  note: >
    Entries the outbox gave up on after exhausting its bounds. Each one is an
    effect that will NOT happen unless a human requeues it (store.Requeue is
    deliberately manual -- an automatic path would undo the bound that just
    fired). Must stay 0 in normal operation; non-zero is an incident, not a
    warning. A gauge rather than a counter because it reflects what is
    currently held, and requeueing legitimately decreases it.
