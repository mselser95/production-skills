# production.yaml — this repo's production contract.
#
# This file declares SEMANTIC FACTS ONLY. Every threshold, obligation and
# scenario list is DERIVED from the org tier policy
# (production-skills _shared/tier-policy.yaml) -- if you are looking for a
# coverage number or a failure-mode checklist here, it belongs there, not in
# this file. <OWNER>/<SERVICE> are slots prod-new substitutes at scaffold
# time; every semantic value below is a real, working example a new service
# replaces with its own answers to the four questions (prod-new's Phase 1).

version: v1

service:
  name: <SERVICE>
  tier: 1
  tier_note: >
    Example tier for the scaffold's own units-ledger capability: T1
    (data-correctness invariants keep the T0 invariant-flake rule -- a
    nondeterministic failure in verification/ratified is an incident, never
    a quarantine -- even though nothing here is irreversible-external-effect
    T0 by itself). A real service replaces this with its own ratified
    answer to prod-new's Phase 1 question 2.
  policy: production-skills (single source, main)

invariants:                         # ratified -- resolve to verification/ratified/
  - units_conserved
  - duplicate_event_single_effect

capabilities:
  - id: units_notification
    class: external_effect
    package: internal/adapter/out/store
    verified:
      outbox_journal_then_deliver_then_mark: internal/adapter/out/store TestOutbox_JournalThenPublish_MarksDelivered
      idempotency_key_stable_across_retries: TestOutbox_Publish_ReusesTheSameIdempotencyKeyAcrossRetries
      durable_intent_survives_restart: TestOutbox_DurableIntentSurvivesARestartAndResumesUnderTheSameKey (store.OpenDurable replays internal/platform/outboxlog at boot)
      journal_refuses_unencodable_effect: TestOutbox_JournalRefusesAnUnencodableEffect (an intent a restart could not replay is never accepted)
      idempotency_key_stable_across_publish_invocations: TestOutbox_IdempotencyKeyIsStableAcrossPublishInvocations (the key belongs to the ENTRY, so a Reconcile pass re-delivers under the SAME key rather than re-keying)
      max_attempts_never_retries_forever: TestOutbox_Publish_ExhaustsMaxAttemptsAndMarksFailed
      reconciliation_resumes_pending_entries: TestOutbox_Reconcile_ResumesPendingEntries
      stalled_delivery_drains_without_intervention: ./cmd/<SERVICE> TestRun_DrainsAStalledOutboxEntryWithNobodyCallingReconcile (the composition root drives Reconcile on a ticker plus a boot wake-up; the mechanism above is what it drives)
      conformance_kit: TestOutbox_PassesExternalEffectConformanceKit (verification/conformance.ExternalEffectKit)
    assumed:
      fsync_reaches_stable_storage:
        detector: >
          NOT VERIFIED HERE. internal/platform/outboxlog fsyncs every record
          before Append returns, but removing that Sync call STAYED GREEN
          under mutation on 2026-08-18: no in-process test can distinguish
          fsync from no-fsync, because a normally-exiting process flushes its
          writes anyway. Durability against a MACHINE kill is therefore
          assumed, not proven. The line carries a NO TEST GUARDS THIS LINE
          marker and registries/contract-debt.yaml holds the owned, expiring
          entry for the docker-kill test that would close it.
      sink_receiver_dedups_by_idempotency_key:
        detector: internal/adapter/out/store's own ackLostOnceSink test double
          proves the CONTRACT this assumption depends on; a real Sink
          implementation (this template ships LogSink, a working
          demonstration) must honor the same idempotency-key contract for
          the assumption to hold in production.

  - id: units_ledger
    class: source_of_truth
    durability: durable (append-only local file, internal/platform/eventlog)
    package: internal/domain, internal/app
    verified:
      conservation: verification/ratified/invariants_test.go TestInvariant_UnitsConserved
      idempotency: verification/ratified/invariants_test.go TestInvariant_DuplicateEventAppliedOnce
      recovery_rebuild_from_log: internal/platform/eventlog TestAppendAndReplay_RoundTrips + internal/e2e (integration tag) TestSvc_RealEventLogAndRealTCP_DepositAndWithdrawSurviveARestart
      state_machine_recovery_semantics: internal/app/ledger.go's commandState doc (csReceived -> csLogged -> csApplied -> csEffectsJournaled -> csCommitted)
      conformance_kit: internal/app TestLedger_PassesSourceOfTruthConformanceKit (verification/conformance.SourceOfTruthKit; serialization_conflict exercised for real under -race, the rest skipped with documented reasons -- see production.yaml's out_of_scope for the storage-choice framing)
    semantics:
      consistency: single-writer, immediately consistent (internal/app.Ledger
        holds one in-memory domain.State guarded by its own mutex; no
        concurrent-writer conflict resolution exists or is needed at this
        scale)

  - id: health_metrics_surface
    class: external_read
    package: internal/adapter/in/healthhttp
    verified:
      conformance_kit: internal/adapter/in/healthhttp TestServer_PassesExternalReadConformanceKit (verification/conformance.ExternalReadKit; stale_data and unavailable exercised for real, the rest skipped with documented reasons -- this is a driving adapter reporting internal state, not a client of an external feed)
      observability_contract_checked: TestMetricsContract_ScrapeMatchesManifestBothDirections
    semantics:
      contract: observability/emitted-metrics.yaml (series) +
        observability/spans.yaml (spans)
      readiness: multi-gate -- durable-log-writable AND
        no-recent-invariant-violation (cooldown-gated, evaluated via the
        ReadinessAt(now) seam); a missing gate is reported, never silently
        assumed satisfied

# Ratified declines. Each is a recorded decision with its reason -- never a
# silent omission.
# Dimensions this repo IMPLEMENTS, each naming the test that proves it.
#
# The probe does not take these on trust: it runs `go test <package> -list` to
# confirm the test exists, then EXECUTES it and requires green. A name that
# decays into a test nobody kept is reported as decayed evidence, not as a
# pass -- which is the whole difference between this and a keyword grep.
implemented:
  effect_journal_atomic: ./cmd/<SERVICE> TestRebuildOutboxFromLog_RecoversEffectsLostInTheCommitWindow
  bounded_boot: ./internal/platform/eventlog TestRecover_UsesTheSnapshotAndReplaysOnlyTheTail
  bounded_storage: ./internal/platform/eventlog TestCompact_BoundsTheLogAndPreservesTheState
  egress_backpressure: ./internal/adapter/out/store TestOutbox_PendingBoundHoldsUnderAnOutageAndNothingIsLost

# Every mechanism this service claims, paired with the symbol that must
# survive linking from ./cmd/... . The probe builds the binary and reads its
# symbol table: a symbol the linker eliminated is a mechanism nothing calls.
#
# This block exists because "implemented and tested" turned out not to imply
# "reached by production" FOUR times in one repo -- a tracer nobody
# constructed, counters nobody wired, a durable constructor the composition
# root never used, and a Reconcile with no caller. Each passed its own tests,
# which is what made them worse than missing.
#
# Add a line here when you add a mechanism. If the symbol you would name is
# one the linker keeps only because it satisfies a used interface, say so in a
# comment -- see the probe's stated limit.
driven:
  durable_outbox: store.OpenDurable
  event_log: eventlog.Open
  snapshots: eventlog.(*Log).Snapshot
  # outbox_reconcile names the LOOP in package main, not Outbox.Reconcile
  # itself, and the difference is the whole value of this row. *Outbox is
  # converted to healthhttp.OutboxHealth, and the linker retains EVERY method
  # of a type that reaches an interface -- measured on this template:
  # `go tool nm` resolved store.(*Outbox).Reconcile while nothing on earth
  # called it, so this row passed the exact defect it exists to catch.
  # main.reconcileLoop belongs to no interface, so deleting the goroutine that
  # starts it eliminates the symbol and reds this row. Match it with grep -F:
  # the method name it replaced is full of regex metacharacters, and a plain
  # grep -E reports a false ABSENCE for it.
  outbox_reconcile: main.reconcileLoop
  tracing: observability.New

out_of_scope:
  - write_surface_authn: >
      This scaffold exposes NO surface that accepts work. internal/adapter/in
      ships healthhttp (/healthz, /readyz, /metrics -- all read-only) and
      pprofhttp (off unless PPROF_PORT is set). There is nothing to
      authenticate, so this is a decline of fact rather than of judgement.
      IT LAPSES THE MOMENT A WRITE ENDPOINT IS ADDED. A service that grows an
      admin or submit surface owes either a credential on it or a replacement
      decline naming who may reach it -- "it only binds to loopback" is not
      that decline, because a published container port ends it.
  - deployment_resource_limits: >
      The scaffold ships docker/Dockerfile and no orchestration manifests or
      compose file, so there is nowhere here to set a memory or CPU limit.
      This decline lapses as soon as the repo ships deployment artifacts: an
      unlimited container lets one runaway process take its host, which is a
      security property as much as an operational one.

  - backup_restore_test: >
      This scaffold's only durable store is a local append-only file
      (internal/platform/eventlog) -- there is no managed backup/restore
      infrastructure (no object-store snapshot, no PITR) to test against in
      a template. A real deployment's storage choice (a managed volume with
      its own backup policy, or a durable log shipped to object storage)
      determines what a real backup_restore_test looks like; that choice is
      deployment-specific, not something this scaffold can decide.
  - partition_key: >
      The scaffold's example aggregate is a SINGLE units ledger: one balance,
      one applied-set, one version counter. There is no key to partition on,
      because there is only one instance of the thing -- and inventing a
      partition key for a single aggregate would be a fabricated answer to a
      real question, which is worse than the decline.

      What this decline does NOT mean: that horizontal scale was waved away.
      It means the EXAMPLE domain is genuinely single-writer. A real service
      replaces this entry with its own key the moment its state has one
      (per-account, per-symbol, per-tenant), and the framework's own
      experience is that the state usually IS decomposable long before anyone
      partitions it -- the obstacle is normally a shared counter or cursor
      threaded through the design, which is cheap to avoid now and expensive
      to remove later. See dimensions.md §12.
  - published_contract: >
      This scaffold publishes NOTHING to a consumer it does not own. Its only
      egress is store.LogSink, which "delivers" by emitting a structured log
      line -- a real demonstration of the outbox pattern, but not an API
      anybody parses. There is no versioned payload to pin because there is no
      foreign reader to break.

      What this decline does NOT mean: that published contracts are optional.
      It lapses the moment a real Sink is wired -- an HTTP webhook, a broker
      subject, a queue -- because at that instant the payload becomes an API
      owned by whoever consumes it. The framework's own experience is that this
      is the asymmetry teams get backwards: they version the formats only they
      read (this scaffold does, rigorously, in internal/platform/eventlog and
      internal/platform/outboxlog) and ship the outward-facing payload with no
      version at all. You can always migrate your own log. You cannot migrate
      someone else's consumer. See dimensions.md §14.
  - authz_invariants: >
      No tenants and no credentials exist in this scaffold's example flow;
      the units ledger has no multi-tenant boundary to enforce.

# Unmet REQUIRED obligations do NOT live here. They are waivers with owners
# and expiries in registries/waivers.yaml, enforced by
# scripts/check-registries.sh -- a spec key invented to hold them would be
# the exact escape the framework forbids.

# Scalability (dimension 12) -- REQUIRED BY DEFAULT at every tier. A system is
# assumed to need vertical AND horizontal scale unless a decline below says
# otherwise. The three testable sub-dimensions (bounded_boot, bounded_storage,
# egress_backpressure) are proven the same way every other executable claim in
# this file is: `implemented:` names a test and the probe RUNS it.
scalability:
  # fsync_per_event | group_commit | no_durable_writes.
  #
  # This scaffold fsyncs every Append (internal/platform/eventlog), buying a
  # ZERO loss window at the cost of a per-event disk round trip -- roughly
  # 5ms mean, tens of ms at the tail, and a hard ceiling of one fold per
  # fsync no matter how much CPU you add. That is the right trade for a
  # ledger and the wrong one for a high-rate venue, which would batch and
  # accept a bounded loss window instead. Stated here so the choice is
  # visible rather than inherited: a service that copies this scaffold and
  # then needs throughput must change this line deliberately, not discover
  # the ceiling in production.
  durability_trade: fsync_per_event

# Bounded auto-recovery (dimension 13) -- REQUIRED BY DEFAULT at every tier.
# Dimension 8 asks whether a failure is VISIBLE; this asks whether the system
# comes BACK, and within what bound.
auto_recovery:
  # Two surfaces recover unaided, and they answer different questions.
  #
  # BOOT: a corrupt or unreadable snapshot does not fail the start and does not
  # silently restart from genesis pretending nothing happened -- it falls back
  # to full replay and says so (internal/platform/eventlog
  # TestRecover_CorruptSnapshotFallsBackToFullReplayAndSaysSo, still green).
  #
  # STEADY STATE: a delivery the sink refused is retried until it lands.
  # cmd/<SERVICE>'s reconcileLoop drains the outbox on a 10s floor plus a
  # boot wake-up, so a stalled entry gets at least two attempts inside the
  # bound below. This is what implemented.self_recovery now names, because the
  # boot claim -- true, and proven -- could never have caught the gap that was
  # actually here: Reconcile was implemented, tested, and called from nowhere,
  # so the scaffold DETECTED a delivery failure and never returned from one.
  recovery_bound: 30s

# Data lifecycle (dimension 15).
data_lifecycle:
  # The event log is compacted behind snapshots (internal/platform/eventlog),
  # so history is bounded by the snapshot cadence rather than kept forever.
  # This is the POLICY statement; bounded_storage above is the engineering one,
  # and they are deliberately separate questions with different owners.
  retention_policy: compacted-behind-snapshots
  # crypto_shredding | tombstone_rebuild | log_expiry | no_subject_data.
  #
  # The example aggregate is a units ledger: a balance, an applied-set and a
  # version counter. There is no subject -- no account holder, no tenant, no
  # personal data -- so there is nothing a deletion request could name. This is
  # the same fact that makes authz_invariants a decline above.
  #
  # A real service replaces this the moment its state has a subject, and it
  # must do so at DESIGN time: "delete this subject's data" is genuinely hard
  # against an immutable append-only log and harder once a snapshot has folded
  # that data in, because deleting the log record leaves the snapshot holding
  # it. Both real designs -- crypto-shredding and tombstone-plus-rebuild -- are
  # architectural choices, not later additions. See dimensions.md §15.
  deletion_mechanism: no_subject_data

gates:
  cheap: "make check-fast"
  presubmit: "make verify"
  advisory: "make test-advisory"

# Dimensions the probe checks by EXECUTING the test named here (see
# scripts/verify-standard.sh). A dimension listed here is implemented and
# proven, not declined.
#
# Naming a test here is a CLAIM the probe cashes: it lists the test, runs it,
# and fails the row if the test is missing or red. So an entry added
# optimistically -- before the test exists -- reports as decayed evidence
# rather than as progress. Add the entry when the test does.
implemented:
  # Was the boot path (eventlog's TestRecover_CorruptSnapshotFallsBackToFull
  # ReplayAndSaysSo, still green and still the reason boot self-heals). It is
  # replaced here because that test proves recovery on a path that runs ONCE,
  # and the dimension asks whether a failure detected in STEADY STATE is
  # returned from. This one induces the real thing -- a delivery the sink
  # refused -- boots the actual composition root, and asserts the entry drains
  # with nobody calling Reconcile.
  self_recovery: ./cmd/<SERVICE> TestRun_DrainsAStalledOutboxEntryWithNobodyCallingReconcile
  # Upgraded from the probe's keyword fallback: `reconciliation` used to pass
  # on a grep for "reconcil" in any .go file, which every version of this repo
  # satisfied including the ones where nothing ran it.
  reconciliation: ./cmd/<SERVICE> TestReconcileLoop_RetriesAStalledEntryUntilTheSinkRecovers
  effect_journal_outbox: ./internal/adapter/out/store TestOutbox_DurableIntentSurvivesARestartAndResumesUnderTheSameKey
