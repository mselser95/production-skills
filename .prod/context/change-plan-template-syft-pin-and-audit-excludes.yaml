context: ".prod/context/resolved-context-template-syft-pin-and-audit-excludes.yaml"
semantic_events:
  - none        # no dependency, state, effect, retry or queue; two gate/tooling changes in the template
files:
  - { path: "prod-new/template/.github/workflows/ci.yaml", action: modify, zone: shell }
  - { path: "scripts/template-workflow-pins.sh", action: create, zone: shell }
  - { path: "scripts/tests/template-workflow-pins-selftest.sh", action: create, zone: shell }
  - { path: "Makefile", action: modify, zone: shell }
  - { path: "prod-new/template/scripts/changed-line-coverage.sh", action: modify, zone: shell }
  - { path: "prod-new/template/Makefile", action: modify, zone: shell }
  - { path: "prod-new/template/scripts/tests/changed-line-coverage-selftest.sh", action: create, zone: shell }
  - { path: "_shared/probes/acceptance-audit-selftest.sh", action: modify, zone: shell }
  - { path: "prod-new/template/scripts/stamp-template-provenance.sh", action: modify, zone: shell }
  - { path: "prod-new/TEMPLATE-DIGEST", action: modify, zone: shell }
new_states: []
new_effects: []
new_dependencies: []
recovery: []
observability:
  - "changed-line-coverage.sh prints which extra exclusions it applied, so an audit's scope is visible in its output"
compatibility:
  schema: unchanged
  api: additive
candidate_invariants:
  - statement: "no template workflow executes a remote script fetched from a mutable ref"
    evidence: "falsified by any template workflow line that pipes curl or wget to a shell from a branch name, or installs a tool at @latest / @main / @master (scripts/template-workflow-pins.sh is the executable form)"
tasks:
  - id: PS-A
    kind: implement
    summary: "pin the template's syft install by commit and version, and gate template workflows against unpinned remote scripts"
    files: ["prod-new/template/.github/workflows/ci.yaml", "scripts/template-workflow-pins.sh", "scripts/tests/template-workflow-pins-selftest.sh", "Makefile"]
    context: ["template_vending", "a-gate-never-reports-green-over-something-it-did-not-measure", "constraint:public-repo", "constraint:syft-pin"]
    focus: "how are this repo's gates declared in the Makefile's gates target and its selftests discovered, so a new gate over the template's workflows is wired the same way and proven able to fail?"
    ambiguity: none
    tier: sonnet
    cost_rationale: "one workflow step, one small gate script with its selftest, one Makefile line"
    acceptance: []
    depends_on: []
  - id: PS-B
    kind: implement
    summary: "acceptance-audit can leave test-support code out of its changed-line set, through an optional variable of changed-line-coverage.sh"
    files: ["prod-new/template/scripts/changed-line-coverage.sh", "prod-new/template/Makefile", "prod-new/template/scripts/tests/changed-line-coverage-selftest.sh", "_shared/probes/acceptance-audit-selftest.sh", "prod-new/template/scripts/stamp-template-provenance.sh", "prod-new/TEMPLATE-DIGEST"]
    context: ["template_vending", "a-gate-never-reports-green-over-something-it-did-not-measure", "the-installed-tcb-never-diverges-from-source-silently", "constraint:unchanged-when-unset", "constraint:fails-closed", "constraint:floor", "constraint:public-repo"]
    focus: "where does the script build its changed-line set and where does the recipe decide the 0/0 cases, so the same exclusions reach both and the unset path stays byte-identical?"
    ambiguity: low
    tier: sonnet
    cost_rationale: "one script, one recipe, two selftests; the mirrored selftest copy and the digest are mechanical"
    acceptance: []
    depends_on: []
