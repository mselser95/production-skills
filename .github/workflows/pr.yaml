name: PR
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# WHY THIS FILE EXISTS
#
# Until 2026-08-29 this repository had no .github/workflows at all. The repo
# whose entire subject is production verifiability -- and which lists "CI
# itself" as one of its 27 dimensions, demanding validated workflow files and
# required checks that cannot be skipped into passing -- had no CI of its own.
# `gh pr checks` answered "no checks reported", which by this repo's own rule
# means the workflow never ran, not that nothing was wrong.
#
# The gates below are the ones that already existed and ran only when somebody
# remembered to type their path. They now also run here, on every PR, where
# forgetting is not available.

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Ties every line scripts/run-once.sh writes to THIS run: `make evidence` attests
      # only to lines carrying the same id, so a stale results file (a re-run on a
      # reused workspace, a cache) can never be attested. It is on the allowlist of the clean
      # environment every gate runs in, which is how the gates see it at all.
      EVIDENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # fetch-depth: 0 is what makes the secret scan below mean anything.
      # actions/checkout defaults to depth 1, so `gitleaks detect` over history
      # would scan ONE commit and report clean -- a scan whose denominator is a
      # single commit is the zero-inputs shape wearing a green check.
      # Measured locally at full depth: 231 commits scanned, no leaks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PINNED, both of them, as of 2026-08-29. Until today this step accepted
      # whatever PyYAML the runner image happened to ship and `make lint` used
      # whatever shellcheck was preinstalled -- so the definition of "green" here
      # moved whenever GitHub rebuilt its image, in either direction. A linter
      # that silently stops reporting a class of finding is the worse half: the
      # build stays green and the coverage shrinks, which is the same
      # nothing-checked-looks-like-checked-and-none shape every probe in this
      # repo refuses.
      #
      # actionlint (v1.7.7) and gosec (v2.21.4, in the template) were already
      # pinned; these two were the remaining unpinned tools in the gate path.
      - name: python + PyYAML (skills-static parses frontmatter as real YAML)
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      # The Python service template's gate selftest proves each gate can fail by building
      # the template's locked environment; without uv it skips those cases as one. uv is
      # installed from the template's own hash-pinned requirements file.
      - name: uv (hash-pinned, for the Python service gates selftest)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r prod-new/modules/service-python/template/ci/uv-requirements.txt
          uv --version

      # Installed ahead of PATH so `make lint` picks up the pinned binary rather
      # than the image's. Verified in the same run by printing the version the
      # gate will actually use -- installing a pin and then linting with a
      # different binary is a pin that documents an intention and enforces
      # nothing.
      - name: shellcheck (pinned)
        run: |
          ver=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$ver/shellcheck-$ver.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-$ver/shellcheck" /usr/local/bin/shellcheck
          command -v shellcheck
          shellcheck --version | grep '^version:'

      # RUN ONCE. This place used to hold three named steps -- the skills-static
      # selftest, skills-static itself, and a hand list of twelve commands (nine
      # selftests plus the policy-coverage, agents-budget and skill-weight gates). Every
      # one of them was run again, in the same job, by `make selftests` or `make
      # check-fast` below; measured, each selftest suite executed three to four times per
      # run. Each is now run exactly once, below, and each property its comment protected
      # is kept by a mechanism that does not need the repetition:
      #
      #  * "prove the verifier before trusting its verdict": the selftests step runs
      #    BEFORE check-fast in the single step below, and the job is red if either is.
      #  * "listed individually, never globbed -- a glob over a renamed directory reports
      #    success over nothing": the Makefile's REQUIRED_SELFTESTS lists the ten suites
      #    this hand list named, and `make selftests` exits 2 if any of them is missing
      #    or was not among the suites the glob ran. That is the fail-closed half the
      #    list was for, with no second execution.
      #  * "a hand list is exactly what let two selftests sit red for weeks": the glob is
      #    the denominator, as the check-fast step's own comment says.
      #  * policy-coverage, agents-budget and skill-weight are gates in `make gates`.
      #
      # The one exception is skill-weight, kept as named lines. The existing
      # _shared/probes/skill-weight-selftest.sh wiring check greps THIS file for exactly
      # these two standalone lines, and a selftest may not be edited to accommodate a
      # workflow change; removing them turns that selftest red.
      - name: skill-weight (the two lines skill-weight-selftest.sh's wiring check pins)
        run: |
          bash _shared/probes/skill-weight-selftest.sh
          bash _shared/probes/skill-weight.sh

      # The eval harness's own gate (benchmarks/eval: runner, host adapters,
      # grader plumbing, corpus lint). A harness whose runner or grader is
      # broken reports numbers nobody should trust, so its selftest, the
      # corpus helper selftests and the corpus lint run here on every PR.
      # Hermetic: the stub host and FAKE claude/codex binaries on a temp PATH,
      # no credentials, no model call, no network. The seatbelt and keychain
      # cases need macOS and are reported as `SKIP <case> (darwin-only)`
      # against a declared set; the rest run on this Linux runner with the
      # documented EVAL_CLAUDE_NO_SANDBOX=1 opt-out set by the test itself.
      # Needs python3, git, make (all on ubuntu-latest); no Go, no PyYAML.
      - name: eval harness (hermetic)
        run: make eval

      # SECRET SCANNING, added 2026-08-29. Until today this repo ran NONE -- a
      # grep for gitleaks/trufflehog in this file returned zero, in the
      # repository whose own standard lists secret scanning on every trigger as
      # a blocking supply-chain gate. It is not advisory and it has no
      # continue-on-error: a leaked credential is not a trend.
      #
      # PINNED to v8.21.2, and installed from `github.com/zricethezav/gitleaks`
      # -- the module path the tool actually declares. `github.com/gitleaks/...`
      # is the repo URL and `go install` rejects it with "module declares its
      # path as", which is the kind of failure that gets a security step
      # commented out at 6pm.
      #
      # PROVEN NON-VACUOUS before being wired, and the first attempt was a false
      # negative worth recording: planting AWS's own DOCUMENTATION keys
      # (AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMI...) produced "no leaks found",
      # because gitleaks allowlists exactly those. A scanner tested with a
      # secret designed to be ignored proves nothing. Re-tested with
      # non-allowlisted random keys plus an RSA private-key block: 2 leaks
      # found, exit 1, and back to 0 once removed.
      - name: secret scanning (blocking)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          GOBIN="$(go env GOPATH)/bin"
          "$GOBIN/gitleaks" detect --source . --no-banner --redact --exit-code 1

      # ADVISORY, and printed rather than gated. It answers "is each committed
      # benchmark score still about the skill it sits next to?" -- currently no
      # for all seven, by 10-12 days. Refreshing needs Codex credentials CI does
      # not have, and a step that fails until someone supplies a secret it
      # cannot supply is a step people delete. So it reports into the log where
      # a reader of these scores will see it.
      - name: benchmark currency (advisory)
        run: bash _shared/probes/benchmark-currency.sh

      # Validate the workflow definitions. CI cannot meaningfully validate its
      # own file -- an invalid workflow yields ZERO checks, not a red one -- so
      # this is also wired into the local cheap gate. Here it covers the
      # template's three workflows, which are copied verbatim into every repo
      # the skill scaffolds and are therefore the ones with real blast radius.
      # The template's three are linted AFTER slot substitution, which is the
      # only form that ever runs. Linted raw they fail with SC1073 "couldn't
      # parse this redirection" on `go build ./cmd/<SERVICE>`: shellcheck reads
      # the placeholder as a shell redirect. The tempting fix -- drop them from
      # the lint -- would leave the three workflows with real blast radius (they
      # are copied verbatim into every scaffolded repo) unchecked, so the slot
      # is filled instead. Verified 2026-08-29: raw -> 3 errors, substituted ->
      # clean, so this step is not passing by looking away.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          AL="$(go env GOPATH)/bin/actionlint"
          "$AL" -color .github/workflows/pr.yaml
          mkdir -p /tmp/tmpl-wf
          for f in ci pr nightly; do
            sed 's/<SERVICE>/svc/g' \
              "prod-new/template/.github/workflows/$f.yaml" > "/tmp/tmpl-wf/$f.yaml"
          done
          "$AL" -color /tmp/tmpl-wf/ci.yaml /tmp/tmpl-wf/pr.yaml /tmp/tmpl-wf/nightly.yaml

      # THE REPO'S OWN ENTRYPOINT, added 2026-08-29 along with the Makefile it
      # calls. Every step above names a probe path directly, which is how the
      # repo ended up running gates it did not know it was missing: measured the
      # same day, `_shared/probes/row-vacuity-sweep.sh` was invoked by this
      # workflow ZERO times and by the pre-commit hook ZERO times, while being
      # wired into prod-new/template/Makefile so that every SCAFFOLDED repo runs
      # it. The framework vended a gate it did not run on itself.
      # check-registries.sh had the same shape -- its selftest ran here, the
      # check itself never looked at this repo's own four registries.
      #
      # `make check-fast` is also what the pre-commit hook runs, so running it
      # here is what keeps the two from drifting: a probe added to the Makefile
      # is a probe both surfaces run, with nothing to remember. It adds
      # shellcheck (36 unique scripts of 62, deduped by content because
      # install.sh mirrors the shared probes into all nine skills
      # byte-identically), the vacuity sweep, and the registry check.
      #
      # actionlint is installed by the step above; PATH does not survive between
      # steps, so it is re-exported rather than reinstalled.
      - name: make selftests + make check-fast (each gate and suite runs once, here)
        run: |
          GOBIN="$(go env GOPATH)/bin"
          export PATH="$GOBIN:$PATH"
          # `make selftests` first, and it is NOT redundant with check-fast.
          # check-fast runs the gates; selftests runs the verifiers OF those
          # gates, and it enumerates them by GLOB (plus the REQUIRED_SELFTESTS
          # guard). A hand list is exactly what let two selftests sit red for
          # weeks here; the glob picks a new suite up with nothing to
          # remember, so a selftest is covered whichever surface somebody
          # forgets to update. It runs before the gates it verifies, so a gate's
          # green is never read without its verifier having been proven.
          # Both call scripts/evidence-record.sh --run, which executes each gate and
          # suite through scripts/run-once.sh in a clean environment and leaves one line
          # per gate and per suite in .evidence/results.tsv -- the lines `make evidence`
          # and mutation-baseline.sh read below instead of running them again.
          make selftests
          make check-fast

      # End-to-end on the installer itself, into a throwaway config dir, so the
      # TCB manifest and the staleness branch are exercised rather than assumed.
      # install.sh honours CLAUDE_CONFIG_DIR, so this touches nothing real.
      #
      # --verify must be GREEN immediately after install: a fresh install that
      # reports drift or staleness against the tree it was just made from is the
      # installer contradicting itself.
      - name: install.sh end-to-end (TCB manifest + staleness)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/cfg
        run: |
          bash install.sh
          bash install.sh --verify

      # NON-VACUITY of the staleness branch. Without this the step above proves
      # only that --verify can say yes. Touch a source file the installed copy
      # cannot know about, and --verify MUST exit 2 and name it. If it stays
      # green, the check that guards "the installed skills are the current ones"
      # is decoration, and the whole TCB story with it.
      - name: prove --verify actually goes red (mutation)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/cfg
        run: |
          printf '\n<!-- ci staleness mutation -->\n' >> prod-ops/SKILL.md
          # Into RUNNER_TEMP, not the repo root. This step wrote ./out.txt and never
          # removed it, so every run left a stray file at the top of the tree --
          # found because the evidence record started NAMING what made the tree
          # dirty and reported `?? out.txt` on run 33285082743. A scratch file at
          # the repo root is one careless `git add -A` from being committed, which
          # has happened here before.
          out="$RUNNER_TEMP/verify-mutation.txt"
          if bash install.sh --verify > "$out" 2>&1; then
            echo "FAIL: --verify reported success with a stale source file" >&2
            cat "$out" >&2
            exit 1
          fi
          grep -q "stale: prod-ops/SKILL.md" "$out" || {
            echo "FAIL: --verify went red but did not NAME the stale file" >&2
            cat "$out" >&2
            exit 1
          }
          git checkout -- prod-ops/SKILL.md
          bash install.sh --verify

      # THE EVIDENCE RECORD (dimension 11, reproducibility), added 2026-08-29.
      # Every repo scaffolded from prod-new gets one, written by
      # verify-standard.sh -- which is Go-only and refuses to run here, so this
      # repo inherited the dimension with its mechanism attached to a probe that
      # cannot execute, and nothing filled the gap.
      #
      # LAST IN THE JOB, and the first draft had it fourth from last, which
      # would have shipped a permanently red step: `make evidence` includes the
      # tcb-integrity gate, `install.sh --verify` exits 1 with "no manifest ...
      # run install.sh first" until the installer has run, and the installer
      # step came AFTER it. Caught by reading the step order against what the
      # gate needs, not by CI. It also needs the same CLAUDE_CONFIG_DIR those
      # steps used, or it verifies a config dir nobody installed into.
      #
      # CI's tree is clean, so the record is named <sha>.json and IS an
      # attestation. It is uploaded rather than committed: this workflow holds
      # `contents: read`, and a durable record is not worth granting a job write
      # access to master. The run that produced it is its provenance.
      #
      # It no longer re-runs the gates the steps above already ran. The old comment
      # here said it did so DELIBERATELY -- "a record assembled from another step's
      # exit codes attests to what the YAML says ran, not to what ran" -- and that
      # property is kept, by a different mechanism: the record is not assembled from
      # step exit codes. scripts/evidence-record.sh --run (what `make gates` and `make
      # selftests` call) runs every gate through scripts/run-once.sh, in a clean
      # environment: that is the process that EXECUTES it and writes its line (command string, exit
      # code, hash of the output, tree identity, this run's id). `make evidence`
      # (evidence-record.sh --attest) takes a gate from that file only for a
      # well-formed line with the same id, the same command string, the same tree
      # (HEAD, clean, or dirty plus a content hash) and this run's id, and with no
      # conflicting duplicate; anything else it executes itself, and the record names
      # which gates were `executed` and which `attested`, with the results-file line.
      # The recorded command is the argv that actually ran (no free-form label), a dry
      # `make -n` records nothing, and `probe-selftests` has no aggregate line: it is
      # derived from one line per suite of THIS run, so it cannot be attested while a
      # suite is missing. EVIDENCE_RUN_ID (job env above) is what enables recording at all.
      # What still executes here, through the same runner (group `post`/`agg` in GATES, not in
      # `make gates`): mutation-trend (it reads the suite counts the selftests step recorded),
      # ratified-invariants, tcb-integrity (it needs the installer step above), and any gate
      # the single pass did not cover. The Makefile is not read to decide any of this.
      - name: evidence record (dimension 11)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/cfg
        run: |
          GOBIN="$(go env GOPATH)/bin"
          export PATH="$GOBIN:$PATH"
          make evidence

      - name: upload the evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: .prod/evidence/*.json
          if-no-files-found: error

  # THE DATABASE MODULE'S BOOTSTRAP TEST, on a real PostgreSQL (Docker is preinstalled
  # on ubuntu-latest). Before this job the 107-assertion test existed and nothing ran
  # it. It is also the first linux/amd64 evidence for the image lock, whose runtime
  # facts were observed on arm64 only.
  #
  # The path filter is a STEP, not workflow-level `paths:` (this workflow has other
  # jobs) and not a job-level `if`: a skipped job reports "skipped", and a required
  # check that is skipped can leave a PR waiting. The job always starts and always
  # reports; with no database change it says so on one line and ends green.
  db:
    runs-on: ubuntu-latest
    # parity + two bootstrap runs + two scrape runs + a cold pull of two images.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: did the database module change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "db: running (event $EVENT)"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD) || { echo "db: cannot diff against $BASE" >&2; exit 1; }
          if grep -qE '^(prod-new/modules/db-postgres/|Makefile$|\.github/workflows/pr\.yaml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "db: running (database module, Makefile or workflow changed)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "db: skipped: no database change"
          fi

      # `make db-test` starts with parity-check.sh, which parses YAML.
      - name: python + PyYAML (parity-check.sh parses YAML)
        if: steps.changed.outputs.run == 'true'
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      # A cold pull (exporter ~20 MB, Prometheus ~100 MB+) must not count against the scrape
      # test's 45 s start cap. The digests come from the same lock the overlay is checked against.
      - name: pre-pull the observability images
        if: steps.changed.outputs.run == 'true'
        run: |
          lock=prod-new/modules/db-postgres/db/observability/image.lock
          for k in exporter prometheus; do
            image=$(sed -n "s/^$k\.image = //p" "$lock")
            digest=$(sed -n "s/^$k\.digest = //p" "$lock")
            if [ -z "$image" ] || [ -z "$digest" ]; then echo "db: no $k image in $lock" >&2; exit 1; fi
            docker pull --quiet "$image@$digest"
          done

      - name: db-postgres bootstrap test (plain, then timescale)
        if: steps.changed.outputs.run == 'true'
        run: make db-test

  # THE VENDED PRODUCT, BUILT. Added 2026-08-29.
  #
  # This repository's product is a scaffolded repo, and until today nothing ever
  # built one. The `actionlint` step above substitutes the template's slots and
  # lints its three WORKFLOW FILES -- real coverage, and it stops at YAML. A
  # change that broke the template's Makefile, its fitness checks or its Go code
  # shipped green here and was discovered by whoever scaffolded next. The
  # integration lane existed for install.sh and not for the thing this repo is
  # for.
  #
  # Measured by hand before wiring, which is why the scope is check-fast and not
  # verify-standard: a correctly instantiated template reaches `make check-fast`
  # exit 0, and `make verify-standard` PASS 64 / FAIL 3 / NA 18 -- where all
  # three FAILs are prod-new Phase-3 steps a machine cannot do (SLO objectives a
  # human ratifies, a load baseline only meaningful on the target hardware, and
  # provenance headers needing a diff base). Gating on verify-standard would
  # make this job permanently red for reasons that are not defects; gating on
  # check-fast asks the question a machine can answer.
  #
  # Its own job, not a step, so a red scaffold is distinguishable at a glance
  # from a red framework.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: prod-new/template/go.mod

      # Slots live in PATHS as well as contents, and sed rewrites contents only.
      # The script does both and then REFUSES if either kind survives -- a
      # content grep alone reported zero remaining slots while cmd/<SERVICE> was
      # still a directory, and `go build` then failed with `malformed import
      # path ... invalid char '<'`, an error that names the import and sends the
      # reader into go.mod.
      - name: instantiate the template
        run: bash scripts/instantiate-template.sh "$RUNNER_TEMP/scaffold" svc mselser95

      - name: build the scaffold
        working-directory: ${{ runner.temp }}/scaffold
        run: go build ./...

      # The scaffold checks itself against the template it came from, so the
      # stamp has to exist -- absent provenance is "the question cannot be
      # answered" (exit 2), not "no drift".
      - name: stamp provenance and run the scaffold's own cheap gate
        working-directory: ${{ runner.temp }}/scaffold
        env:
          TEMPLATE_DIR: ${{ github.workspace }}/prod-new/template
        run: |
          git init -q .
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm scaffold
          bash scripts/stamp-template-provenance.sh
          make check-fast
