# postgresql.conf — hardened baseline for the db-postgres module (PostgreSQL 18).
# Loaded with `-c config_file=` (see compose.yml); it REPLACES the data
# directory's postgresql.conf, so everything that matters is in this file.
# Every name and value below was checked against pg_settings on 18.7.

# ---- connections -----------------------------------------------------------
# Listens on every interface OF THE CONTAINER; the compose file publishes no
# host port, and pg_hba.conf accepts TCP only over TLS from loopback/samenet.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'

# ---- authentication --------------------------------------------------------
password_encryption = 'scram-sha-256'

# ---- TLS -------------------------------------------------------------------
# Certificate and key are generated into the dbtls volume by the tls-init
# service (bootstrap/tls-init.sh): self-signed, DEVELOPMENT ONLY. Production
# supplies a real certificate at these two paths.
ssl = on
ssl_cert_file = '/tls/server.crt'
ssl_key_file = '/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# ---- statistics monitoring will need (T23) ---------------------------------
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
track_io_timing = on
pg_stat_statements.track = 'top'
# Utility statements (ALTER ROLE ... PASSWORD, COPY, SET, ...) are stored with
# their literals, not normalised, and pg_monitor members can read them. Not
# tracking them keeps a password typed into SQL out of the statistics; the cost is
# that DDL and COPY do not appear in pg_stat_statements.
pg_stat_statements.track_utility = off

# ---- logging ---------------------------------------------------------------
# stderr only: the container runtime collects it.
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_connections = 'receipt,authentication,authorization'
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = '10MB'
# Slow statements are logged WITH their text. Parameters bound by the client
# (extended protocol, `$1`) are NOT (log_parameter_max_length = 0 below), but a
# literal written INLINE in the SQL text is part of the text and IS logged. So a
# client that handles personal or secret data must bind parameters; this server
# cannot tell the difference. Set to -1 to log no statement text at all
# (pg_stat_statements still shows slow ordinary queries, with constants normalised).
log_min_duration_statement = '250ms'
log_autovacuum_min_duration = '1s'
# Statement logging is OFF. `ddl` would log every ALTER ROLE ... PASSWORD with
# the password in it (PostgreSQL does not redact), so rotating a password the
# obvious way would leak it; the cost is no DDL trail in the log (use an audit
# extension for that, none ships here). Bind values are never logged either.
log_statement = 'none'
# The text of a FAILING statement is never logged (`panic` is above every error
# level): the default (`error`) writes `STATEMENT: <sql with its literals>`. The
# cost is debuggability: the ERROR line says what failed but not which statement.
# Raise it to `error` only on a database that holds no real data.
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
