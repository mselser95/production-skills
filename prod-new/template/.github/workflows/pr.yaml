name: PR
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Staged presubmit, stage 1: compile + vet + a plain `go test ./...`
  # (no -race) + architecture. Runs first and stays cheap (seconds) so a
  # trivially broken PR fails before it pays for the full -race + fuzz
  # lane in `production-gates`. It is a strict subset of `make verify`, so
  # it can never be red while production-gates is green -- only the other
  # way around, which is the point.
  check-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check-fast
      # PROVE THE VERIFIER BEFORE TRUSTING ITS VERDICT. Each of these drives
      # verify-standard.sh's own logic against crafted fixtures and asserts
      # BOTH directions. They are listed individually rather than globbed:
      # `for f in scripts/tests/*-selftest.sh` reports success over an empty
      # glob if the directory is ever renamed, which is the fail-open shape
      # every one of these files exists to refuse.
      - name: probe selftests (the verifier of the verifier)
        # ONE LIST, not three. This step used to restate the five scripts
        # that `make probe-selftests` already names, and so did ci.yaml --
        # three copies that had to agree. The pre-commit hook in the framework
        # repo records the rule this breaks: "two lists that must agree are one
        # list and one latent defect". Measured 2026-08-29: the Makefile target
        # was referenced by NOTHING (not verify, not check-fast, no workflow,
        # no doc), and while it sat uninvoked it went RED -- 10 failing cases
        # across sbom-ordering and check-registries, both from probe changes
        # that never updated their selftests. The duplicate lists are why the
        # target could rot unnoticed: CI ran the scripts, so nobody missed the
        # target, and the target was where the list lived.
        #
        # Still explicit, never a glob: the Makefile names all five, so a
        # renamed directory breaks the build instead of reporting success over
        # an empty glob.
        run: make probe-selftests

  production-gates:
    needs: check-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/retry.sh go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make verify

  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make e2e

  # The one check that cannot run in-process: SIGKILL a real container and
  # prove the outbox intents it had already fsynced are still there. Removing
  # the Sync call in internal/platform/outboxlog stays GREEN under every unit
  # test, because a normally-exiting process flushes its writes anyway -- so
  # this job is the only thing in CI that would notice. It is a JOB of its own
  # rather than a step of e2e-real so a docker failure reads as a docker
  # failure, not as an e2e regression.
  kill-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make kill-durability

  # SAST, BLOCKING. tier-policy: `sast_specialized: { mode: required, scope:
  # declared_untrusted_input_surface, blocking: required }`. It is its own job,
  # not a step inside another, so it produces its own required check that cannot
  # be skipped into passing by an earlier job's `needs:` failing.
  #
  # gosec finds a different class from govulncheck beside it: govulncheck
  # answers "does this code CALL a known-vulnerable function in a dependency",
  # gosec answers "does this code contain the vulnerability itself" -- unhandled
  # errors on security-relevant calls, weak randomness, command injection,
  # hardcoded credentials, path traversal. A repo with only the first is scanning
  # other people's code.
  #
  # NOT `continue-on-error`, and that is the policy's word (`blocking:
  # required`), not a preference. A security scan whose failure does not stop the
  # merge is a report, and this repo's whole argument is that a report nobody is
  # forced to read is not a gate.
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned, like every other tool here: an unpinned scanner changes what
      # "green" means without anyone editing the repo.
      # v2.29.0, not v2.21.4. v2.21.4 DOES NOT BUILD under Go 1.26: it pulls
      # x/tools@v0.25.0, which fails with `invalid array length -delta * delta`.
      # A scaffolded repo on a current Go therefore had a blocking SAST gate
      # that could not even be installed, let alone run.
      - run: bash scripts/retry.sh go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      # -exclude-generated: generated code is not this repo's to fix, and a
      # finding nobody can act on trains people to pass -exclude everything.
      # No -severity filter: the policy says blocking, and choosing which
      # severities block is exactly the widening this standard refuses.
      - run: gosec -exclude-generated ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/retry.sh go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # Secret scanning on every trigger (PR here, push in ci.yaml) --
  # tier-policy.yaml: supply_chain.secret_scan = all_triggers.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is what makes this scan mean anything -- the default is
      # depth 1, and a scan whose denominator is one commit is the zero-inputs
      # shape wearing a green check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # THE PINNED BINARY, NOT `gitleaks/gitleaks-action@v2` -- the action
      # needs a paid licence on an ORGANISATION repo and exits before scanning
      # anything without one. See ci.yaml's secret-scan job for the full
      # argument and for where known findings belong. The two jobs must stay
      # IDENTICAL: a PR lane and a push lane that scan differently means the
      # merge is the first thing that ever scans.
      - name: secret scanning (blocking)
        run: |
          bash scripts/retry.sh go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner --redact --exit-code 1

  # Advisory (candidate-provenance) lane: `continue-on-error: true` means a
  # red run shows a yellow warning on the PR check list but never blocks
  # merge and is never a required context. Exists so unratified candidate
  # tests (prod-test-synth output) can be watched without gating anything --
  # promotion to the blocking lane is prod-curate's job.
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-advisory

  # Changed-line coverage: a NON-BLOCKING PR signal (see
  # scripts/changed-line-coverage.sh), not a gate.
  changed-line-coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/coverage.sh || true
      - run: bash scripts/changed-line-coverage.sh

  # The standard verifies ITSELF here. Runs the dimension probes --
  # coverage+ratchet, ratified invariants and their non-vacuity evidence,
  # the scenario matrix denominator, the real-dependency lane, fuzz
  # targets, tracing WIRED in the entrypoints, the observability
  # contracts, the security scanners, the ops artifacts and their
  # citations -- and fails on any FAIL.
  #
  #
  # SHARDED. One sequential job runs every row, ~5 minutes on a real service,
  # and `go test` already saturates a 4-vCPU runner, so backgrounding inside
  # the script gains little. The probe declares four row GROUPS (suite: build,
  # tests, race, coverage; dynamic: ratified invariants and their non-vacuity
  # mutations, the integration lane, compatibility, replay, the observability
  # contract test, every spec-named implemented test; fuzzbench: fuzz,
  # benchmarks, profiling; static: everything else) and each leg below runs ONE
  # group on its OWN checkout -- which is also what keeps the non-vacuity
  # mutations of production source away from every other reader of the tree.
  #
  # The `verify-standard` job further down is the REQUIRED check, same name as
  # before. It merges the legs' results and refuses unless every group the
  # PROBE declares is present exactly once (so a group dropped from this matrix
  # is a MISSING group, not less coverage), every declared row came from the
  # group that owns it exactly once, every file was written by this probe for
  # this commit and tree, and no row is FAIL.
  #
  # Results go to $RUNNER_TEMP, OUTSIDE the checkout: a results file inside it
  # would be an uncommitted change, and the merge refuses results whose
  # working-tree state differs from its own.
  verify-standard-group:
    name: verify-standard (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: check-fast
    strategy:
      fail-fast: false
      matrix:
        group: [suite, dynamic, fuzzbench, static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Only `static` owns the rows that shell out to these tools (lint,
      # vuln-scan, workflow-definitions-valid); the other groups drop those
      # rows, so installing the tools there buys nothing. Every tool the
      # probe shells to still has to be installed by the job that OWNS the
      # row -- the same mistake in the other direction cost
      # clcsolutions/marketdata a red gate with 60 rows green and only `lint`
      # red, because THAT job installed actionlint and not golangci-lint.
      - name: Install probe tooling (static group)
        if: matrix.group == 'static'
        run: |
          bash scripts/retry.sh go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          bash scripts/retry.sh go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          bash scripts/retry.sh go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify this group of the production standard
        run: bash scripts/verify-standard.sh --group "${{ matrix.group }}" --out "$RUNNER_TEMP/verify-standard/${{ matrix.group }}.json"
      # always(): a RED group must still upload its results, so its findings
      # are on record next to the failed leg.
      - name: Upload this group's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-standard-${{ matrix.group }}
          path: ${{ runner.temp }}/verify-standard/${{ matrix.group }}.json
          if-no-files-found: error

  # The REQUIRED check. `if: always()` is load-bearing: a job whose `needs`
  # failed, was cancelled or was skipped is itself SKIPPED by default, and a
  # skipped required check counts as PASSED at the branch-protection layer. So
  # this job always runs and fails explicitly unless every need is `success`
  # (for a matrix, `needs.<job>.result` is success only when EVERY leg is).
  verify-standard:
    runs-on: ubuntu-latest
    needs: [check-fast, verify-standard-group]
    if: always()
    steps:
      - name: Every upstream job must have succeeded (skipped or cancelled is not success)
        run: |
          if [[ "${{ needs.check-fast.result }}" != "success" || "${{ needs.verify-standard-group.result }}" != "success" ]]; then
            echo "verify-standard: check-fast=${{ needs.check-fast.result }} groups=${{ needs.verify-standard-group.result }} -- a group that failed, was cancelled or was skipped is a finding, never a pass" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download every group's results
        uses: actions/download-artifact@v4
        with:
          pattern: verify-standard-*
          merge-multiple: true
          path: ${{ runner.temp }}/verify-standard
      - name: Merge the groups and decide
        run: bash scripts/verify-standard.sh --merge "$RUNNER_TEMP"/verify-standard/*.json

  # Real build-provenance attestation via GitHub's own OIDC-based action --
  # no stored signing key, no external service, a genuine SLSA-style
  # attestation of the binary this PR would ship (tier-policy.yaml:
  # supply_chain.artifact_provenance = required). Runs on every PR so a
  # broken build step is caught before merge, not just on release.
  attest-build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath -o svc-bin ./cmd/<SERVICE>
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: svc-bin
