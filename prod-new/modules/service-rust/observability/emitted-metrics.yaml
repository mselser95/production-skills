# Checked-in manifest of every metric series this service emits.
#
# Contract: the ONLY way code names a metric is the typed table in
# crates/app/src/telemetry.rs (an enum per kind; a string does not compile).
# tests/observability_contract.rs compares that table with this file in both
# directions: name, type and label KEYS. A variant without an entry fails; an
# entry without a variant fails; a changed type or label key fails. Names start
# `svc_`; counters end `_total`. Label VALUES are passed in the declared key
# order.
#
# Fields:
#   name   - the series name (exactly as emitted)
#   type   - counter | gauge
#   labels - closed label set, [] if none
#   note   - anything an alert-rule author needs to know

- name: svc_build_info
  type: gauge
  labels: [revision, config_digest]
  note: >
    Standard build_info convention: the value is ALWAYS 1 and the signal lives
    in the labels. `revision` is the git SHA baked in at build time,
    `config_digest` fingerprints this process's resolved config. Both are
    bounded by deploy: one value per running process.

- name: svc_units_conserved_violations_total
  type: counter
  labels: []
  note: >
    Ratified invariant units_conserved. Must stay 0 in production;
    app::Ledger checks State::conservation_holds before applying every command
    and increments this the instant it disagrees (and applies nothing). The
    deliberate-violation proof is the app test
    a_corrupt_store_fires_the_violation_counter_and_applies_nothing.

- name: svc_events_total
  type: counter
  labels: [kind, outcome]
  note: >
    One increment per command. kind is deposit|withdraw; outcome is
    applied|duplicate|rejected. Both label sets are closed.

- name: svc_balance_units
  type: gauge
  labels: []
  note: Balance in minor units after the last command that reached the store.

- name: svc_last_applied_unix_seconds
  type: gauge
  labels: []
  note: Unix time of the last applied event; a flat line means writes stopped.

- name: svc_http_requests_total
  type: counter
  labels: [route, code]
  note: >
    One increment per HTTP reply. route is healthz|metrics|balance|deposit|
    withdraw|other; code is the class 2xx|4xx|5xx.
