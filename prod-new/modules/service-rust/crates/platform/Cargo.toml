[package]
name = "svc-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "<SERVICE> platform zone: clock, ids, config, recorder, signals; depends on app"

# The dependency graph IS the zone rule: app (it implements the ports) plus
# the signal-handling crate. Not `adapter`, not `domain` (it needs nothing
# from it).
[dependencies]
svc-app = { path = "../app" }
# Signal handling for graceful shutdown (SIGINT + SIGTERM). Platform zone only.
ctrlc = { version = "=3.5.3", features = ["termination"] }

[lints]
workspace = true
