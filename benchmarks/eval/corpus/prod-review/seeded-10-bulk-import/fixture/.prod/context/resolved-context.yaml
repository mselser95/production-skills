# resolved-context.yaml
task: Keep importing after one row fails to store, skip blank lines and accept long rows, so a single bad row does not discard the rest of a large file.
tier: 2
services: [bulkimport]

capabilities:
  touched: []
  obligations: []

invariants: []

required_evidence:
  gates: [go build ./..., go vet ./..., go test ./...]
  signals: [test results]

constraints:
  - standard library only; no new module dependencies
  - exported API stays source-compatible for existing callers

do_not_touch:
  - verification/ratified/**
  - .prod/**
  - production.yaml
