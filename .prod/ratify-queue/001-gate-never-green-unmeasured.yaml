invariant: a-gate-never-reports-green-over-something-it-did-not-measure
status: RATIFIED
ratified_by: mselser95
ratified_on: '2026-08-31'
test: verification/ratified/inv-001-no-green-over-unmeasured.sh

statement: >
  No row in any probe this repo ships may report PASS for a dimension whose
  evidence it did not actually obtain. Zero inputs, an unparseable file, a
  missing tool, a branch that never emitted -- each must produce FAIL or a
  reasoned NA, never green.

why_this_one: >
  It is the property the entire framework exists to enforce in other repos, and
  on 2026-08-29 this repo violated it seven times in its own probe: a comment
  counted as code in four rows (tracing-wired-in-prod passed with the tracer
  never injected), two rows passed on zero-byte files, and one reported a count
  it had failed to compute. If this invariant does not hold HERE, every repo
  the framework touches inherits a lie.

evidence:
  fail_closed_sites:
    - "_shared/probes/verify-standard.sh: the `not probed: no branch emitted this dimension, and an unemitted row counts in neither PASS, FAIL nor NA` row"
    - "_shared/probes/verify-standard.sh: the invariants-ratified guard that FAILs when the ratified/pending counts are not computable"
    - "_shared/probes/row-vacuity-sweep.sh: exit 2 on zero patterns extracted"
    - "demos/validate-demo.sh: refusal when a runner declares no control and has no inline negative assertion"

non_vacuity_check:
  file: 'scripts/mutation-baseline.sh'
  expect_red: 'verification/ratified/inv-001-no-green-over-unmeasured.sh'
  find: 'the `found ZERO selftests` guard block'
  replace: 'deleted'
  note: >
    Verified 2026-08-31, not asserted. Case 8 of the test is ISOLATED on purpose --
    its fixture carries a valid baseline file so the "nothing to compare against"
    path cannot fire, leaving the zero-suites guard as the only thing between an
    empty tree and a green report. Removing that guard (syntax confirmed still
    valid, so the mutation breaks the TEST and not the build) turned inv-001 red:
    `FAIL mutation-baseline over zero suites (isolated) -- REPORTED GREEN over an
    absent subject`, 9 ok / 1 failed.
    The other nine cases are protected by more than one guard -- measured by
    removing each in turn and watching the test stay green -- which is fine for
    the property and useless as evidence, so the package cites the isolated one.
