# Tier policy — the org's answers, so nobody is ever asked for a threshold.
#
# This file exists so bootstrap DERIVES instead of interrogating. Every value
# here is an org-level decision made once; a repo inherits it from its tier and
# only records DEVIATIONS. Skills read this; humans edit it deliberately.
#
# Read together with dimensions.md (the completeness checklist) and the
# capability class checklists below (the scenario denominators).

version: v1

defaults: &defaults
  # Correctness — structural (SIGNAL, never a hard gate: gameable)
  changed_line_coverage_signal: 85
  global_coverage_policy: ratchet        # never below high-water minus 2 points
  tests_per_prod_loc: informational      # recorded, never a target. ever.

  # Fault sensitivity — always advisory, all tiers (tooling immaturity + Goodhart)
  mutation: { mode: advisory, scope: changed_code, cap_mutants_per_pr: 20 }

  # Design-time verification (dimension 17) — one level above mutation on the
  # same fault-sensitivity spectrum: mutation finds what tests miss in code
  # that exists, this finds what the DESIGN fails to rule out before code
  # exists. Advisory and narrow-scoped everywhere by default -- the cost only
  # pays for itself on a genuinely concurrent/distributed protocol core, and
  # mandating it broadly produces a rubber-stamp model nobody checks against
  # the implementation, which is worse than no model.
  formal_methods: { mode: advisory, scope: novel_concurrent_or_distributed_protocol_core }


  # Deterministic simulation testing (dimension 27) — ADVISORY, and the
  # advisory is the honest part of this entry rather than a hedge in it.
  # FoundationDB runs the whole system on a simulated network, disk and clock
  # under a seeded fault schedule, so a failure IS a seed and reproducing it
  # is rerunning that seed ("FoundationDB: A Distributed Unbundled
  # Transactional Key Value Store", SIGMOD 2021). It sits one step past
  # `formal_methods` above on the same spectrum: that key checks a model of
  # the design, this one runs the real code against a controlled world.
  #
  # The prerequisites already exist here, and were not built for this: the
  # scaffold injects clock, randomness and IDs, and keeps a pure decision
  # core (`operational_determinism` below, and the three architectural
  # zones). A repo on this standard is closer to stage 1 than it knows, which
  # is why the entry is worth recording before the harness exists.
  #
  # What does NOT exist is the harness, and `mode: advisory` says exactly
  # that — it is not a tier relaxation, it is this framework declining to
  # levy a requirement it cannot yet check. Declaring it required today would
  # be satisfied by a `-race -count=N` lane renamed "simulation", which is
  # this file's own textbook vacuous form committed on purpose. The entry
  # moves to required_or_ratified_decline when a stage-1 harness ships AND
  # its non-vacuity is demonstrated the way every other gate here pays for
  # itself — break the thing it guards, watch it go red — and not one commit
  # before.
  simulation:
    mode: advisory                        # no harness exists yet; see above
    stage1: seeded_fault_schedule_over_app_layer
                                          # single process, the REAL app
                                          # layer, fakes beneath it, faults
                                          # chosen by a recorded seed — the
                                          # reproducible half. Simulated
                                          # network and disk are stage 2 and
                                          # explicitly not this

    # What ends "advisory": the first seed that reproduces a defect no
    # other lane caught. Every vacuous row this framework removed began as
    # a real requirement nobody could satisfy honestly yet; recording the
    # promotion condition is what stops advisory becoming permanent.
    promotion_condition: first_seed_found_defect
  # Behavioral
  property_tests: required_on_core
  fuzz: required_on_decode_boundaries    # every parse/decode boundary, seed corpus checked in
  metamorphic: recommended

  # Scenarios — denominator comes from class checklists, NEVER from the author
  scenario_coverage: { denominator: class_checklists, gate_at: null }

  # Integration / contracts
  integration_fidelity: hermetic_plus_one_real   # ≥1 lane against a real dependency
  compatibility: { policy: n_minus_1, schema: expand_contract, breaking_check: required }
  # Schema evolution (dimension 19) -- names what `breaking_check: required`
  # above must actually mean, for any event-driven surface (Avro, JSON
  # Schema, protobuf, or an equivalent format with independent readers): a
  # MECHANICAL, CI-BLOCKING compatibility check computed against every
  # schema version still in use by a named consumer -- not a diff against
  # the PR's own prior state, which passes trivially on the PR that deletes
  # a field a live consumer still reads. Connects to prod-spec's
  # `changes_schema` semantic event: this is the requirement that event is
  # meant to pull in. Industry practice, deliberately uncited -- no academic
  # source was given for this one and none should be invented.
  schema_evolution: { enforcement: ci_blocking,
                       baseline: all_versions_in_use_by_named_consumers }
  # Consumer-driven contracts (dimension 21). Ian Robinson, "Consumer-Driven
  # Contracts: A Service Evolution Pattern" (martinfowler.com, 2006) -- the
  # pattern's definition, cited as such; there is no empirical result behind
  # it and none is implied.
  #
  # `published_contract.shape_pinned` below already makes the provider pin
  # what it emits. That check has one author on both sides: a provider can
  # rename a field and update its own pin in the same commit, every gate
  # green, and the consumer reading that field finds out in production. This
  # key inverts the authorship -- the CONSUMER states the subset it depends
  # on, and the PROVIDER's build verifies it. What it buys is not more tests
  # but a different oracle, plus the only mechanical way this framework has to
  # SHRINK a published surface: fields no contract claims.
  #
  # `verified_in_provider_build: required` is the anti-vacuity key. A consumer
  # test passing against its own stub proves the stub matches the expectation.
  # `currency` is the second: a contract from a consumer that has since
  # changed what it reads leaves the provider defending a shape nobody wants
  # while believing it is covered.
  consumer_contracts:
    mode: required_if_publishes           # same trigger as
                                          # published_contract.versioned
    authored_by: consumer                 # never the provider; one author on
                                          # both sides is the vacuous form
    verified_in_provider_build: required  # against the real handler, blocking
    currency: declared                    # last published, and whether that
                                          # consumer is still deployed
    unclaimed_fields: reported            # published surface no contract
                                          # reads -- the shrink signal

  # Performance
  benchmarks: { baseline: required, comparison: statistical_relative_only,
                absolute_slo: dedicated_hardware_only, profiling: periodic }
  capacity: { margin_target: 2x, measured: required }


  # Load, stress and soak (dimension 25) — the key that finally CASHES
  # `capacity: { margin_target: 2x, measured: required }` above. That entry
  # has been in this file since v1 and nothing anywhere measures it: no
  # harness, no probe row, no lane, and dimension 6 inventories a "known
  # saturation point" that no artifact records. A margin is a RATIO, and a
  # ratio needs a numerator somebody observed. This is this framework's own
  # vacuous form, sitting in its own policy file, and it is named here rather
  # than quietly fixed.
  #
  # `generation: open_loop` is the anti-vacuity key, and it is the whole
  # dimension in one word. A closed-loop harness — N workers, each sending
  # its next request only after the previous one returns — cannot offer load
  # faster than the system accepts it. When the system stalls the harness
  # politely stalls with it, the requests that WOULD have arrived are never
  # issued, and so never counted: the omission is COORDINATED with the very
  # failure the run exists to expose (Gil Tene, "How NOT to Measure Latency",
  # a talk, not a paper — cited as one). What such a run reports is the
  # latency of the requests the system was willing to take, which is how a
  # saturated service produces a beautiful tail. A closed-loop p99 is THE
  # vacuous form of this dimension, and it is the form almost every Go
  # benchmark in existence already has.
  #
  # `measurement: coordinated_omission_safe` is the same requirement pointed
  # at the histogram rather than at the generator: latency is measured from
  # the INTENDED send time, so a request delayed behind a stall carries the
  # queueing it actually suffered instead of only its service time.
  #
  # `saturation_point: measured` is the second anti-vacuity key. A declared
  # saturation point is a guess with a unit attached. The measured one is the
  # offered rate past which throughput stops rising while queueing delay
  # starts climbing — the two curves crossing, which is Little's law read off
  # a graph (J. D. C. Little, "A Proof for the Queuing Formula: L = λW",
  # Operations Research 9(3), 1961). That number, divided into the declared
  # peak, IS the margin `capacity` above has been asking for.
  #
  # `soak.oracle: resource_growth` is why soak is not merely a longer load
  # test. A leak — goroutines, file descriptors, RSS, a map nothing evicts —
  # is invisible at benchmark durations by construction, and "it ran four
  # hours and did not crash" is a story, not an oracle. The growth curve is
  # the oracle; the crash is what happens to somebody else, later.
  load_testing:
    generation: open_loop                 # fixed offered rate, independent of
                                          # how fast the system replies
    measurement: coordinated_omission_safe
                                          # latency from intended send time,
                                          # not from the send that happened
    saturation_point: measured            # observed on a run and recorded;
                                          # never declared
    baseline_artifact: benchmarks/load/baseline.md
                                          # versioned like every other
                                          # baseline here, and a stale one is
                                          # a finding, not a formality
    soak:
      cadence: nightly                    # hours; deliberately not a PR
                                          # budget, which is what kept this
                                          # dimension out of the file
      oracle: resource_growth             # goroutine / FD / RSS trend across
                                          # the run, not survival

    # FLOOR on what a service may commit to in its own production.yaml —
    # never the commitment itself, since only the service knows its peak.
    # `<n>x` is a factor over expected peak; `<n>%` a percentage of it;
    # the probe refuses to compare one kind against the other. Enforced by
    # prod-spec/prod-review deriving obligations from this file — the probe
    # is vendored and deliberately never reads tier-policy.yaml.
    min_margin: 2x
    # Mirrors the probe's LOAD_MAX_AGE_DAYS. Two numbers that must agree
    # are one number and one latent defect: the probe's constant is the
    # vendored copy of THIS policy choice, and a repo that needs another
    # window declines the dimension with its reason instead of editing it.
    max_baseline_age_days: 30
  # Resilience / recovery
  fault_injection: required_per_capability_class
  # Chaos engineering (dimension 20) is NOT `fault_injection` above with a
  # bigger budget. That key covers a CI harness exercising the faults the
  # author enumerated, per capability class. This one covers experiments
  # against a system carrying production traffic, each stated in advance as a
  # hypothesis about a steady-state metric, drawn from real-world event
  # classes, automated, with an enforced blast radius (Basiri et al., "Chaos
  # Engineering", IEEE Software 33(3), 2016, DOI 10.1109/MS.2016.60). The
  # first verifies the faults you thought of; the second is a claim about the
  # ones you did not.
  #
  # `steady_state_hypothesis: required_per_experiment` is the anti-vacuity
  # key. Without a metric declared BEFORE the run and a threshold that decides
  # pass from fail, the outcome is whatever the person watching concluded, and
  # nothing can regress against it later. Same shape as dimension 17's refusal
  # of "no alerts fired" as a canary verdict.
  chaos_engineering:
    production_experiments: required      # T2 relaxes this to recommended
    steady_state_hypothesis: required_per_experiment
    abort_path: required_and_rehearsed    # an unenforced blast radius is an
                                          # intention, not a property
    cadence: declared                     # continuous/scheduled, or the once
                                          # it was run and written up
  # Consistency verification (dimension 20's second half) -- a DIFFERENT
  # instrument from recovery testing, and the gap it fills is one this file
  # creates: `capability_classes.source_of_truth` obligates
  # `consistency_semantics`, and nothing anywhere checks the declaration. A
  # recovery test asks whether the system comes back; it never asks whether
  # what it served WHILE partitioned was linearizable. The instrument is a
  # recorded history of concurrent client operations checked against the
  # declared model, inferring anomalies from client-observable reads and
  # writes rather than trusting the store to report on itself (Kingsbury &
  # Alvaro, "Elle: Inferring Isolation Anomalies from Experimental
  # Observations", PODC 2021, DOI 10.1145/3465084.3467483).
  #
  # `under_induced_fault: required` is the anti-vacuity key: the anomalies
  # this exists to find are reachable only under partition, failover or clock
  # skew, so a green run against a healthy single node is a green run of
  # nothing.
  consistency_verification:
    mode: required_if_declared_consistency_model
    history_checked: required             # against a recorded history, not
                                          # against the store's own reporting
    under_induced_fault: required         # partition / failover / clock skew
  # effect_journal_atomic: the outbox row must commit ATOMICALLY with the state
  # change it belongs to -- same transaction, or a boot-time projection of the
  # event log. Journaling the effect AFTER the state commit is the shape
  # without the property, and it loses effects in a window nothing reports.
  recovery: { effect_journal: required_if_durable_effects,
              effect_journal_atomic: required_if_durable_effects,
              tabular_recovery_tests: required,
              real_crash_tests: sampled_by_risk }


  # Crash-only software (Candea & Fox, "Crash-Only Software", HotOS 2003).
  # The argument is not about robustness under abuse: it is that a component
  # with only ONE stop path — the abrupt one — has its recovery path
  # exercised on every single stop, so the code that must work at 3am is the
  # code that ran at every deploy. A graceful shutdown is a second, quieter
  # path, and what it hides is always the same thing: state that was durable
  # only because something got to flush it on the way out.
  #
  # `recovery.real_crash_tests: sampled_by_risk` directly above is the
  # sampling of this discipline; this key is the discipline itself, and the
  # repo already owns one worked instance of it. prod-new's
  # scripts/kill-durability.sh SIGKILLs the real container and proves the
  # outbox intents fsynced before the kill are still readable after it — and
  # it REJECTS its own run on any exit code other than 137, because
  # `docker stop` sends SIGTERM, the process flushes on the way out, and the
  # scenario would pass having tested nothing. That script is this key's
  # evidence and its shape; the key generalizes it from the outbox to
  # everything else that holds state.
  #
  # `scope: every_stateful_mechanism` is the anti-vacuity key. One kill test
  # over the one store somebody remembered is the shape without the property:
  # the event log, the snapshot writer, the inbox and any local cache read
  # back after a restart each have their OWN flush, so each owes its own
  # kill. Note the honest ceiling kill-durability.sh already states and this
  # key inherits: a container SIGKILL kills the process, not the machine, so
  # what is proven is that the write reached the kernel — power-loss
  # durability needs a fault-injecting filesystem and is claimed by nothing
  # here.
  #
  # `graceful_shutdown: optimization_never_correctness` keeps the other two
  # honest. A graceful path may exist and may drain connections faster; what
  # it may never be is the reason something is correct.
  crash_only:
    stop_signal: sigkill_only             # the stop path that gets verified.
                                          # A durability run that exits 0
                                          # proved the graceful path, not the
                                          # durability
    scope: every_stateful_mechanism       # event log, snapshots, inbox,
                                          # outbox, local caches read after
                                          # restart — one kill each, not one
                                          # kill total
    graceful_shutdown: optimization_never_correctness
  reconciliation: required_if_durable_state
  backup_restore_test: required_if_durable_state


  # Overload and metastability (dimension 26). Bronson, Aghayev, Charapko &
  # Benson, "Metastable Failures in Distributed Systems" (HotOS 2021): a
  # system pushed past a threshold enters a stable-but-degraded state and
  # STAYS there after the trigger is gone, because the work its own
  # degradation generates — retries, reconnects, re-queued timeouts — is now
  # the load sustaining it. The defining property is that removing the cause
  # does not remove the effect, which is why every key below is about a
  # FEEDBACK LOOP and not about a threshold.
  #
  # `retry_budget` is NOT `external_effect`'s `retry_policy` obligation under
  # a new name, and collapsing the two is exactly how this arrives in a repo
  # that believes it is already covered. A retry POLICY is per call: how many
  # attempts this caller makes, with what backoff and jitter. A retry BUDGET
  # is global: a cap on the ratio of retries to original requests across the
  # process, enforced by refusing to retry once the ratio is exceeded. Three
  # individually polite three-attempt policies in a chain amplify a brownout
  # by 27x, and every one of them passes its own review. The budget is the
  # only key in this file that bounds amplification.
  #
  # `metastable_recovery: chaos_scenario_required` is the anti-vacuity key,
  # and it is the link to dimension 13 that is missing today. Shedding,
  # budgets and breakers are MECHANISMS, and a mechanism nothing drives is
  # dimension 16's failure wearing resilience vocabulary. The scenario
  # induces a retry storm, REMOVES the trigger, and requires the system to
  # return to steady state with no restart and no intervention — because "we
  # restarted it and it came back" is precisely the observation under which a
  # metastable failure hides, and it is the observation an operator makes
  # every time.
  #
  # `degraded_mode` is Fox & Brewer's harvest/yield stated as an obligation
  # ("Harvest, Yield, and Scalable Tolerant Systems", HotOS 1999). Under
  # overload something IS given up; the only question is whether which thing
  # was decided at design time or by whichever code path happened to time out
  # first. Its vacuous form is a capability that answers "we degrade
  # gracefully" without naming what it drops and what it keeps.
  #
  # Hedged requests (Dean & Barroso, "The Tail at Scale", CACM 56(2), 2013)
  # belong to this dimension and are deliberately NOT a key here: on a
  # capability with external effects a hedge duplicates the effect. They are
  # a tactic this dimension cites, not an obligation it imposes.
  overload:
    ingress_shedding: declared_and_tested # with the CRITERION that decides
                                          # what is shed and what survives —
                                          # "it sheds under load" names no
                                          # victim and tests nothing
    retry_budget: required_where_retries  # global amplification cap; see
                                          # above — never the per-call policy
    circuit_breaking: required_on_outbound
                                          # every dependency call, including
                                          # the one nobody expects to be slow
    degraded_mode: declared_per_user_facing_capability
                                          # what is sacrificed first, and
                                          # what that costs the consumer
    metastable_recovery: chaos_scenario_required
                                          # trigger induced, trigger removed,
                                          # recovery WITHOUT a restart

  # Error-handling fitness (Yuan et al., "Simple Testing Can Prevent Most
  # Critical Failures", OSDI 2014). The paper reproduced 198 randomly sampled
  # user-reported failures of Cassandra, HBase, HDFS, MapReduce and Redis and
  # found that 92% of the CATASTROPHIC ones followed from incorrect handling
  # of errors the system had ALREADY CAUGHT AND SIGNALLED -- detection was
  # almost never the defect, the handler was -- and that 35% of them came from
  # three handler shapes trivial enough for a machine to find.
  #
  # This key exists because "review catches those" is measurably false: they
  # were found in shipped, reviewed code, in five of the most-scrutinised open
  # source systems in the field. A greppable defect class with that much
  # empirical weight behind it belongs in the cheap gate, not in a reviewer's
  # attention budget, which is why the mode below is `blocking` at every tier
  # rather than advisory. It is the one fitness function in this file whose
  # justification is a measurement rather than a design argument.
  #
  # `shapes:` is the anti-vacuity key. A gate declared as "error handling is
  # checked" is satisfied by a grep for the word `err`, and this file's whole
  # method is to name the thing that must fail. Each shape below is one of the
  # paper's three, and the scaffold's implementation
  # (scripts/error-handling-fitness.sh, wired into `make check-fast`) is
  # mutation-proven against all three plus a zero-inputs case.
  #
  # `scope_declared: required` is the second anti-vacuity key, and it is the
  # one that keeps this honest rather than loud. The check is a text pass, so
  # it has a false-negative surface -- a handler whose variable is not named
  # `err`, a two-statement swallow, a multi-line signature. An implementation
  # that does not state its own blind spots in its header reads as complete
  # and is not, and a check that overclaims is worse than one that scopes
  # itself: the first stops people looking.
  error_handling_fitness:
    mode: blocking                        # every tier; the empirical weight
                                          # does not thin out at T2
    lane: cheap_gate                      # presubmit, seconds -- these are
                                          # cheapest to remove before a
                                          # reviewer has read the diff
    shapes: [empty_handler, todo_or_fixme_handler, log_and_continue_past_an_available_error_return]
    zero_inputs_fail: required            # a scan of nothing is not a clean
                                          # scan (same rule the liability
                                          # registries already hold)
    scope_declared: required              # the implementation states its own
                                          # false negatives, in its header
    selftest: required_in_the_same_lane   # the gate is a text pass, so its
                                          # failure mode is going silently
                                          # green; the lane must prove it can
                                          # still fail before trusting it

  # Crash-only recovery, asserted rather than declared (Candea & Fox,
  # "Crash-Only Software", HotOS IX, 2003). The argument: a component should
  # have exactly one way to stop -- crashing -- and one way to start --
  # recovering -- because a graceful-shutdown path that differs from the
  # recovery path is code that only runs when things are going well, while the
  # path that runs during an outage is the one nobody exercised.
  #
  # `recovery.real_crash_tests` above already samples real crashes by risk.
  # This key is the assertion those crashes must MAKE, and it is a different
  # claim from the one a durability check makes: "the records survived" and
  # "replaying those records reconstructs the same state" are separate, and a
  # boot that read every byte back and rebuilt the state wrong satisfies the
  # first completely. Nothing in this file previously asked for the second.
  #
  # `state_observable_externally: required` is the key that makes the rest
  # possible and the one most likely to be skipped, because it is a code
  # change rather than a test: state that lives only inside the process cannot
  # be compared with anything, so a service can hold crash-only discipline
  # perfectly and still be unable to demonstrate it. The scaffold satisfies it
  # with a `state` object on /healthz carrying the balance, the applied-set
  # size and a digest over that set.
  #
  # `denominator: required` is the anti-vacuity key. Two captures that both
  # read "unknown" are identical, and an equality assertion over them reports
  # crash-only recovery proven from two readings of nothing -- so a capture
  # must be marked known AND carry a non-empty working set before its equality
  # means anything.
  crash_only_recovery:
    state_identity_across_a_real_crash: required_if_durable_state
    state_observable_externally: required # a claim about state nothing outside
                                          # the process can read is unfalsifiable
    denominator: required                 # an empty or unknown capture must
                                          # FAIL, never compare equal
    assertion_selftest: required          # the scenario needs docker and runs
                                          # in exactly one place, so its logic
                                          # must be exercisable without it --
                                          # otherwise decay shows up only in
                                          # the environment least able to
                                          # debug it

  # Differential observability (Huang, Guo, Lin, Bolosky, Bansal,
  # Ravindranath, Chen, Zhang, Kang and others, "Gray Failure: The Achilles'
  # Heel of Cloud-Scale Systems", HotOS 2017, DOI 10.1145/3102980.3103005).
  #
  # `observability_contract` above asks whether the service EMITS; §22's SLIs
  # ask for a measurement vantage and prefer one OUTSIDE the process. This key
  # is the row neither of them is: the one that READS BOTH AND ALERTS ON THE
  # DELTA. A gray failure is precisely a differential-observability condition
  # -- the component's own health check passes while an application on top of
  # it sees errors, timeouts or unusable latency -- so the detectable quantity
  # is not either view but the gap between them, and a monitoring design that
  # samples one vantage cannot express the defect at all, however many signals
  # it collects from that vantage.
  #
  # `client_vantage_not_self_emitted: required` is the anti-vacuity key, and
  # it is the one that will be violated first, because violating it is easy
  # and looks correct: a series the service emits about its own usability
  # executes in the same process, on the same host, over the same devices, so
  # it goes quiet in exactly the failure the alert exists for. A deployment
  # with no external vantage does not get a rewritten expression; it gets a
  # waiver with an owner and an expiry.
  differential_observability:
    mode: required                        # T2 may relax to recommended
    client_vantage_not_self_emitted: required
    divergence_window: declared           # the two vantages are sampled by
                                          # different systems on different
                                          # schedules; a pointwise comparison
                                          # alerts on scrape skew, not on a
                                          # divergence
    threshold_at_slo_boundary: required   # a client threshold pinned at total
                                          # failure detects the outage the
                                          # self view already saw, not the
                                          # gray state between them

  # Observability
  observability_contract: required        # checked in CI, not documentation
  invariant_counters: required            # ratified invariants mirrored to prod
  operational_determinism: required       # code+config+schema+flag versions in signals
  isolation_and_backpressure: required    # explicit, tested, per-partition
  # Profiles are the FOURTH signal (dimension 8), not a performance chore.
  # `benchmarks.profiling: periodic` above is a different thing and stays: it
  # is the profile you take of a benchmark, on your hardware, to explain a
  # regression you can already reproduce. This key is about whether a profile
  # of the process that was actually slow -- in production, on the build that
  # was deployed then -- exists AT ALL, which is decided before anybody knows
  # to look. Continuous, low-overhead, fleet-wide sampling is the shape (Ren,
  # Tune, Moseley, Shi, Rus, Hundt, "Google-Wide Profiling: A Continuous
  # Profiling Infrastructure for Data Centers", IEEE Micro 30(4), 2010, DOI
  # 10.1109/MM.2010.68); Grafana Pyroscope is the OSS system built to it,
  # named as an example the way this file's dimension 17 names Kayenta.
  #
  # REQUIRED AT EVERY TIER AND FOR EVERY SERVICE, headless included -- that
  # exemption is the specific mistake this key exists to rule out. A batch job
  # that got 40% slower has no request to trace and no dashboard naming the
  # loop; the profile of the slow run is the only artifact that explains it.
  #
  # `build_identity_attached` is not decoration: a profile you cannot
  # attribute to a binary cannot be diffed across a deploy, which is the one
  # operation that makes a profile store worth keeping. It is dimension 11's
  # version record pointed at the fourth signal.
  continuous_profiling:
    collection: required                  # always-on sampling in production,
                                          # NOT an endpoint somebody scrapes
                                          # while the incident is still live
    retention: declared                   # how far back a profile can be
                                          # retrieved for a named window
    build_identity_attached: required     # every profile labelled with the
                                          # build that produced it
    overhead: measured                    # measured, never assumed -- "it is
                                          # only 1%" is a claim, and an
                                          # unmeasured one is how a profiler
                                          # gets switched off in an incident
    types: declared                       # cpu | heap | goroutine | mutex |
                                          # block | alloc -- which of these the
                                          # workload makes worth keeping IS
                                          # derivable (mechanism-derivation.md
                                          # §9); whether to profile at all is
                                          # not
  # Distributed tracing is CONDITIONAL, and the condition is DERIVED from the
  # repo -- never asked, and never assumed universal.
  #
  # A trace is a causal JOIN across process boundaries. A service nothing
  # calls has nothing to join to, so a universal requirement can only be
  # satisfied by emitting root spans nothing will ever parent -- which is
  # dimensions.md §8's measured 3132-spans-in-3132-traces failure, reached
  # deliberately instead of by accident. The derivation and its signals live
  # in mechanism-derivation.md §8: a listener serving routes outside the
  # health/metrics/pprof surface, registered handlers, an inbound port in the
  # deployment artifact, or a carrier extracted from arriving work -- against
  # a poll loop, a ticker, or a main that runs once and exits.
  #
  # THE DECLINE IS NOT FREE. verify-standard.sh turns `tracing-wired-in-prod`
  # NA on a ratified `distributed_tracing` decline ONLY after failing to find
  # a route registered outside the operational surface; find one and the row
  # FAILs, because a decline of fact that the code contradicts is the escape
  # this framework refuses everywhere else. Mutation-verified: neutering that
  # detector flips the contradiction cases back to NA.
  #
  # The three sub-keys are not one boolean, and collapsing them is how this
  # correction gets over-applied. Only `inbound_extraction` is derived.
  distributed_tracing:
    span_emission: required               # the service's own critical
                                          # transitions; universal
    inbound_extraction: derived_or_ratified_decline
                                          # THE derived one. Warranted iff
                                          # work arrives carrying a caller's
                                          # context -- including a queue
                                          # message whose PRODUCER stamped
                                          # one, which is the case most often
                                          # mislabelled "headless". Unknown
                                          # upstream carrier => ask, never
                                          # decline
    egress_injection: required            # universal for anything that makes
                                          # an outbound call: dropping context
                                          # on the way out truncates the trace
                                          # of everything downstream
    correlation_id: required              # a run id, job id or message id
                                          # joining a service's OWN signals,
                                          # whether or not it is a W3C trace
                                          # id. Never declined

  # Wiring (dimension 16) — REQUIRED at every tier, with no relaxation.
  # A mechanism that nothing calls passes its own tests and does nothing in
  # production; four separate instances in one repo is what put this here.
  # Checked against the linked binary, not against source or tests.
  mechanisms_driven: required
  # Reproducibility (dimension 11)
  evidence_record: required               # one record per commit: policy version,
                                          # gates, seeds, waivers

  # Scalability (dimension 12) — REQUIRED BY DEFAULT, every tier.
  #
  # The standing rule is that a system must scale vertically AND horizontally
  # unless a repo ratifies a decline explaining why not. This is deliberately
  # NOT relaxed at T2: a T2 repo that is honestly single-writer owes one line
  # in out_of_scope saying so, which costs nothing and is exactly the mechanism
  # working. The alternative -- letting low tiers skip the question -- is how
  # every one of the defects in dimensions.md's §12 shipped, since each was in
  # a component nobody had classified as needing scale yet.
  #
  # bounded_boot and bounded_storage are `required_if_durable_state` rather
  # than flatly required because a stateless transform has neither a boot
  # history nor a store to grow; the condition is the same one reconciliation
  # and backup_restore_test already use, so a repo answers it once.
  scalability:
    bounded_boot: required_if_durable_state       # recovery time bounded by a
                                                  # snapshot, or the history
                                                  # bound stated explicitly
    bounded_storage: required_if_durable_state    # every append-only store has
                                                  # retention or compaction
    egress_backpressure: required                 # bounded queue/journal per
                                                  # EGRESS boundary. The
                                                  # isolation_and_backpressure
                                                  # entry above covers ingress
                                                  # rate only, and egress
                                                  # accumulation is the hole it
                                                  # leaves.
    partition_key: required_or_ratified_decline   # a named key, or the reason
                                                  # the workload is genuinely
                                                  # single-writer
    durability_trade: declared                    # fsync-per-event vs group
                                                  # commit, and why -- both are
                                                  # correct answers to
                                                  # different questions

  # Bounded auto-recovery (dimension 13) — REQUIRED BY DEFAULT, every tier.
  #
  # Dimension 8 asks whether a failure is VISIBLE. This one asks whether the
  # system comes BACK, and within what bound. They are different questions and
  # a framework that only asks the first produces services that detect
  # beautifully and stay down: the two defects that motivated this were both
  # counted, logged and panelled, and neither ever recovered without a human.
  #
  # "Loud, not silent" is the defence that gets written for these, and it is
  # true and beside the point. Silent-vs-loud is not the axis; recoverable-vs-
  # wedged is.
  auto_recovery:
    self_recovery: required_or_ratified_decline  # a test that INDUCES a
                                                 # detected failure and proves
                                                 # the system returns with no
                                                 # intervention
    recovery_bound: declared                     # the stated maximum time to
                                                 # self-recovery. "manual" is
                                                 # an honest answer and routes
                                                 # to the decline path, which
                                                 # costs a written reason

  # The published contract (dimension 14) — REQUIRED where anything is
  # published to a consumer this repo does not own.
  #
  # Distinct from `compatibility` above, and deliberately not folded into it.
  # That entry is satisfied by any wire/golden test, INCLUDING one over a
  # format only this repo reads — and a format only you read is the one you can
  # always migrate. This dimension is about the payloads you cannot migrate,
  # because someone else parses them. The audience is what makes it expensive,
  # so the audience is what the dimension keys on.
  published_contract:
    versioned: required_if_publishes       # every externally-published payload
                                           # carries a version; a consumer
                                           # cannot negotiate with a shape that
                                           # will not say what it is
    shape_pinned: required_if_publishes    # a test that FAILS when the emitted
                                           # shape changes -- the same rigour
                                           # already applied to internal
                                           # formats, pointed outward
    compatibility_policy: declared         # expand_contract | versioned_envelope
                                           # | none_published
    consumers: declared_or_ratified_decline # who depends on this, or the
                                           # recorded fact that nobody does yet

  # Data lifecycle (dimension 15) — REQUIRED where subject data exists.
  #
  # This framework pushes services toward event sourcing, so it creates this
  # problem and therefore owes an answer to it: "delete this subject's data" is
  # genuinely hard when the source of truth is an immutable append-only log,
  # and harder once a snapshot has already folded that data in. Both real
  # designs -- crypto-shredding and tombstone-plus-rebuild -- must be chosen at
  # design time; neither retrofits cheaply.
  data_lifecycle:
    retention_policy: declared             # how long history is kept and what
                                           # bounds it. Distinct from
                                           # bounded_storage, which asks only
                                           # whether SOMETHING prunes it
    deletion_mechanism: declared           # crypto_shredding | tombstone_rebuild
                                           # | log_expiry | no_subject_data
    subject_deletion: required_if_subject_data  # a test proving a deletion
                                                # request actually removes the
                                                # data, snapshots included

  # Deployability / gate integrity
  #
  # The gates must be RUNNABLE, checked from outside CI. An invalid workflow
  # file does not produce a red check — GitHub produces a zero-second run with
  # no jobs and no check runs, so the PR reports "no checks reported", every
  # required context stays unfulfilled, and no signal anywhere says why. CI
  # cannot catch this, because there is no CI: the check belongs in the local
  # cheap gate and in the probe. This entry exists because a repo shipped a
  # full day of work with every gate green and zero presubmit actually running.
  workflow_definitions_valid: required

  # Security
  supply_chain: { secret_scan: all_triggers, vuln_scan: required, sbom: required,
                  artifact_provenance: required, secretless_presubmit: required }
  # Dependency currency and version pinning (dimension 23). INDUSTRY PRACTICE,
  # NO PAPER -- Dependabot/Renovate and equivalents have no academic result
  # behind them that this framework can cite, and inventing one would be worse
  # than leaving the entry uncited.
  #
  # Two properties in tension, which is why they are one key. `vuln_scan`
  # above catches a KNOWN-vulnerable dependency; nothing today moves a
  # dependency forward on a cadence, and a lockfile with no cadence is a
  # commitment to keep using exactly the version that will eventually be the
  # vulnerable one.
  #
  # `gate_tooling_pinned: immutable_identifier` is the sharper half FOR THIS
  # FRAMEWORK SPECIFICALLY, because here the gates ARE the standard. A step
  # written `actions/checkout@v4` is pinned to a MUTABLE tag its owner can
  # repoint, so the trusted computing base of every gate in the repo is
  # whatever that tag resolved to this morning. prod-new's own CI template
  # does exactly this today -- exact versions for its Go tools
  # (golangci-lint@v2.12.2, govulncheck@v1.7.0) and floating major tags for
  # actions/checkout@v4, actions/setup-go@v5, gitleaks/gitleaks-action@v2.
  # Applying this key files a finding against the framework's own template,
  # which is the correct outcome and should not be softened away.
  #
  # `auto_merge: gate_affecting_excluded` is the anti-vacuity key: an update
  # that changes a linter's ruleset, a scanner's database, or a tool a gate
  # shells out to is a change to the ORACLE. Auto-merging it on green is
  # letting the thing under test approve itself.
  dependency_currency:
    lockfile: committed_and_ci_enforced   # --frozen-lockfile / --locked /
                                          # -mod=readonly, not regenerated in
                                          # CI
    update_automation: required           # with a stated cadence
    open_pr_age: reported                 # an unmerged bot backlog is not
                                          # currency; its AGE is the
                                          # measurement
    gate_tooling_pinned: immutable_identifier   # commit SHA or digest. @v4
                                                # and :latest are not pins
    auto_merge: gate_affecting_excluded
    security_update_lag: declared         # distinct from the ordinary bump
  # Semantic/dataflow SAST (dimension 18) -- distinct from whatever the
  # general linter already does. A controlled study found default SAST
  # rulesets miss the majority of real, confirmed vulnerabilities present
  # in their target codebases -- 61.2% missed (Semgrep* -- Improving the
  # Limited Performance of SAST Tools, ACM/ESEM 2024, DOI
  # 10.1145/3661167.3661262). "SAST ran" is therefore not itself evidence;
  # scope must be the codebase's DECLARED untrusted-input surface (request
  # bodies, queue payloads, RPC boundaries treated as trusted by convention),
  # not the tool's stock source/sink defaults, or the gate is vacuous by
  # construction -- it will run clean regardless of what the code does.
  sast_specialized: { mode: required, scope: declared_untrusted_input_surface,
                       blocking: required }
  authz_invariants: required_if_multi_tenant
  # A surface that ACCEPTS WORK needs a credential or a ratified decline
  # naming who may reach it. Read-only health/metrics endpoints are exempt;
  # anything that mutates is not, and "it only binds to loopback" stops being
  # true the moment a container publishes the port.
  write_surface_authn: required_or_declined
  # One runaway process must not be able to take the host. Applies to whatever
  # deployment artifacts the repo actually ships.
  deployment_resource_limits: required_if_deployment_artifacts

  # Deployability / operability
  #
  # `analysis: automated_plus_invariant_gates` is dimension 17's canary-
  # analysis requirement: a STATISTICAL comparison of the canary population
  # against baseline on the service's own invariants/SLOs, with a defined
  # promote/abort rule -- not an elapsed-time wait and not unaided human
  # judgment reading a dashboard. See dimension 17 for what "automated" must
  # actually mean before this counts as satisfied.
  delivery: { progressive: required, analysis: automated_plus_invariant_gates,
              rollback: artifact_repin, rehearsed: required }
  runbooks: { required: true, exercise_cadence: quarterly }
  liability_registries: required          # flags, waivers, quarantine, contract debt
  # SLO and error budget as a MECHANISM (dimension 22). Beyer, Jones, Petoff &
  # Murphy (eds.), "Site Reliability Engineering" (O'Reilly, 2016).
  #
  # SLOs already appear in this file and in dimensions.md three times, and
  # every appearance is DECLARATIVE -- `benchmarks.absolute_slo`, the
  # runbooks/alerts inventory, and dimension 17's canary scoring. None asks
  # the question that turns an SLO into an instrument: what CHANGES when the
  # objective is missed. "99.9% over 30 days" is also the statement that ~43
  # minutes are BUDGETED, and the remaining balance is a number a release
  # decision can read.
  #
  # `sli.vantage_point: declared` is the anti-vacuity key, and it is the same
  # defect as dimension 13's progress metric: availability computed from the
  # server's own success counter omits every request the load balancer
  # dropped, so the number is correct exactly while the system is healthy.
  # `exhaustion_policy` is the other: a burn-rate panel no decision reads is a
  # dashboard, not a budget.
  #
  # `objective: human_ratified` is deliberate -- the objective comes from what
  # a consumer needs, not from last month's measured availability, which
  # cannot be missed and therefore decides nothing. A correctness invariant
  # with no meaningful percentage form (100%-or-page) is a COMPLETE answer
  # here, not a missing one.
  slo:
    sli: { defined: required_per_user_facing_capability,
           vantage_point: declared }
    objective: human_ratified
    window: declared                      # and whether it rolls or resets
    error_budget: computed                # a balance, not a prose target
    burn_rate_alerts: two_windows         # a fast one for the outage and a
                                          # slow one for the drip; paging on
                                          # the SLI itself is a page nobody
                                          # reads by week three
    exhaustion_policy: declared_and_enforced

  # Domain ownership and cross-domain boundaries (dimension 24,
  # domain-boundaries.md) -- OPT-IN, unlike every key above it. Applies only
  # when `_shared/domain-topology.yaml` exists; a single-service org never
  # sets this and the dimension is a legitimate NA, not a gap.
  #
  # `role_matches_topology: required_if_declared` is the anti-vacuity key,
  # same shape as `published_contract.shape_pinned` above: a repo's own
  # `domain_role` claim is worthless if nobody checks it against the org's
  # single source of truth for who owns what -- see dimensions.md's "vacuous
  # form" `domain_role` asserted, topology not consulted`.
  #
  # `dependency_resolution: domain_gateway_only` is the invariant itself: a
  # `domain_dependencies` entry whose `via:` capability is not classed
  # `domain_gateway` in the TARGET's own spec is a violation, not a style
  # note. Where the target checkout is unavailable to confirm it, the
  # obligation is `unverified_cross_repo`, never a silent pass.
  domain_boundaries:
    role_matches_topology: required_if_declared
    dependency_resolution: domain_gateway_only
    cross_repo_confirmation: unverified_cross_repo_if_unresolvable
    waived_exceptions: registries/domain-boundaries.yaml # owner + expiry, swept by prod-ops OP-5

tiers:
  "0":
    <<: *defaults
    changed_line_coverage_signal: 90
    # The framework marks scenario coverage a GATE at T0 (100% of the class
    # checklists). The shared default leaves gate_at null for T1/T2; T0 must
    # override it or a T0 repo silently loses a declared gate.
    scenario_coverage: { denominator: class_checklists, gate_at: 100 }
    invariant_flake_rule: incident        # never quarantine
    human_gates: [resolved_context, semantic_declarations, ratification, waivers]
    delivery: { progressive: required, analysis: automated_plus_invariant_gates,
                rollback: artifact_repin, rehearsed: required, human_ack_before_full: true }
    # T0 is where a missed interleaving is most expensive; a new
    # concurrent/distributed protocol at this tier owes a checked model or a
    # ratified decline saying why one was not worth writing -- advisory
    # elsewhere, not here.
    formal_methods: { mode: required_or_ratified_decline,
                       scope: novel_concurrent_or_distributed_protocol_core }
    # Only the floor moves, and only upward: T0 is where a saturation
    # surprise is least recoverable — an irreversible external effect issued
    # past the knee of the curve cannot be un-issued. YAML's `<<:` merge is
    # SHALLOW, so this repeats the whole map rather than one key; the values
    # other than min_margin must match defaults.load_testing or T0 silently
    # loses them (same shape as scenario_coverage above).
    load_testing:
      generation: open_loop
      measurement: coordinated_omission_safe
      saturation_point: measured
      baseline_artifact: benchmarks/load/baseline.md
      soak: { cadence: nightly, oracle: resource_growth }
      min_margin: 3x
      max_baseline_age_days: 30
  "1":
    <<: *defaults
    invariant_flake_rule: incident        # data-correctness tiers keep the T0 rule
    human_gates: [ratification, waivers]
  "2":
    <<: *defaults
    changed_line_coverage_signal: 70
    fuzz: recommended
    benchmarks: { baseline: recommended, comparison: statistical_relative_only }
    fault_injection: recommended
    chaos_engineering: { production_experiments: recommended,
                         steady_state_hypothesis: required_per_experiment,
                         abort_path: required_and_rehearsed,
                         cadence: declared }
    invariant_flake_rule: quarantine_allowed
    human_gates: [waivers]

# Capability class checklists — THE scenario denominators. Bootstrap expands
# these into the repo's failure-mode matrix automatically; the author never
# supplies the list.
capability_classes:
  external_effect:
    obligations: [timeout, retry_policy, failure_model, idempotency_strategy,
                  reconciliation, observability]
    scenarios: [rejected, timeout_before_acceptance, timeout_after_acceptance,
                duplicate_response, malformed_response, unavailable,
                extreme_latency, crash_between_decision_and_effect,
                retry_on_unknown_state,
                # Dimension 26. This class's `retry_policy` obligation is
                # per call and these two are what the call cannot see:
                # retry_storm is every caller retrying at once (the
                # amplification `overload.retry_budget` bounds), and
                # slow_downstream_congestion is the dependency that answers
                # SLOWLY instead of failing — no error to trip a breaker,
                # every caller's connections held, which is the entry into
                # the metastable state Bronson describes.
                retry_storm, slow_downstream_congestion]
  source_of_truth:
    obligations: [consistency_semantics, recovery, backup, reconciliation]
    scenarios: [deadlock, serialization_conflict, timeout,
                commit_ok_response_lost, connection_dies_before_commit,
                connection_dies_after_commit, restore_from_backup]
  event_consumer:
    obligations: [delivery_semantics, ordering_semantics, duplicate_handling,
                  poison_handling, backpressure]
    scenarios: [duplicate, delay, reorder, drop, poison_message, partition,
                upstream_backpressure,
                # Dimension 26. `upstream_backpressure` above is the
                # producer slowing down, which is the polite case. This is
                # the producer's own retries multiplying the stream: the
                # arrival rate rises while the useful rate does not, so
                # duplicate handling and the consumer's lag budget are both
                # exercised by load that carries no new information.
                upstream_retry_storm]
  event_producer:
    obligations: [delivery_semantics, ordering_guarantee, observability]
    scenarios: [slow_consumer, consumer_disconnect, publish_failure, replay]
  external_read:
    obligations: [max_age_declared, staleness_observable, unavailable_fallback,
                  timeout]
    scenarios: [stale_data, gap, malformed_response, unavailable, slow_response]
  connection:
    obligations: [reconnect_policy, liveness_detection, resubscribe_semantics,
                  readiness_gating]
    scenarios: [disconnect, sequence_gap, missed_heartbeat, reconnect_storm,
                half_open_socket, resubscribe_failure, scheduled_recycle,
                # Dimension 26. `reconnect_storm` above is one client
                # reconnecting repeatedly; this is every client reconnecting
                # at the same instant after a shared disconnect, and the
                # difference is the synchronization, not the volume — an
                # upstream restart aligns all of them, their backoff was
                # never jittered, and the reconnect load itself keeps the
                # upstream down.
                thundering_herd_reconnect]
  signer:
    obligations: [key_custody, policy_enforcement, audit_trail, quorum]
    scenarios: [unauthorized_request, policy_violation, key_unavailable,
                partial_quorum]
  # Domain gateway (dimension 24, domain-boundaries.md). The ONLY capability
  # class an outside domain may depend on. Its obligations are what the
  # GATEWAY itself owes its consumers -- not what a caller owes the gateway,
  # which is the domain_dependencies / domain-boundaries.yaml side of the
  # same invariant (see domain-boundaries.md; this class alone does not
  # enforce "nobody bypasses it", it only says what the sanctioned door must
  # provide once declared). Deliberately reuses external_read/external_effect
  # framing rather than inventing new scenario shapes: a domain_gateway is a
  # normal capability with one extra fact attached (it is this domain's
  # published boundary), so its checklist composes with whichever of those
  # two classes actually describes the traffic instead of replacing it.
  domain_gateway:
    obligations: [contract_version, backward_compat_window, consumer_registry,
                  deprecation_policy]
    scenarios: [breaking_change_undetected, deprecated_field_removed_early,
                unregistered_consumer, schema_drift_undetected]
