# resolved-context.yaml
task: Let a consumer take the items whose deadline has passed, and let an idle consumer be woken when something is queued.
tier: 2
services: [deadlineq]

capabilities:
  touched: []
  obligations: []

invariants: []

required_evidence:
  gates: [cargo build --locked --offline, cargo clippy --locked --offline -- -D warnings, cargo test --locked --offline]
  signals: [test results]

constraints:
  - standard library only; no new crate dependencies
  - exported API stays source-compatible for existing callers

do_not_touch:
  - verification/ratified/**
  - .prod/**
  - production.yaml
