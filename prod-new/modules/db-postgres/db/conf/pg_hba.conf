# pg_hba.conf — scram-sha-256 only, TCP only over TLS.
#
# No `trust`, no `md5`, no `password`, no plain `host` rule. A connection that
# matches no rule is refused by the server (default deny), so a non-TLS TCP
# client gets "no pg_hba.conf entry ... no encryption".
#
# `local` is the unix socket INSIDE the container (docker exec, the image's
# init scripts, which authenticate with PGPASSWORD). Nothing reaches it from
# outside the container.
#
# TYPE      DATABASE  USER  ADDRESS      METHOD
local       all       all                scram-sha-256
hostssl     all       all   127.0.0.1/32 scram-sha-256
hostssl     all       all   ::1/128      scram-sha-256
# Peers on the container's own network(s) only; tighten to the real client
# CIDR in a deployment.
hostssl     all       all   samenet      scram-sha-256
