# pg_hba.conf — scram-sha-256 only, TCP only over TLS, first match wins.
#
# No `trust`, no `md5`, no `password`, no plain `host` rule. A connection that
# matches no rule is refused by the server (default deny), so a non-TLS TCP
# client gets "no pg_hba.conf entry ... no encryption".
#
# The `reject` rules come FIRST, so no later allow rule can reach them:
#   - physical replication (database keyword `replication`) is refused for
#     every user on every path. A logical replication connection
#     (replication=database) names a real database and is therefore governed by
#     the next rules plus the REPLICATION attribute, which only the superuser
#     has; the superuser is refused over TCP below.
#   - the superuser `postgres` is refused over every TCP address: it logs in only
#     through the unix socket INSIDE the container (docker exec, the image's init
#     scripts), never from a peer on the compose network.
#
# `local` is the unix socket inside the container; nothing reaches it from
# outside. The healthcheck and every application role use hostssl 127.0.0.1.
#
# TYPE      DATABASE     USER      ADDRESS        METHOD
local       replication  all                      reject
hostssl     replication  all       0.0.0.0/0      reject
hostssl     replication  all       ::/0           reject
hostssl     all          postgres  0.0.0.0/0      reject
hostssl     all          postgres  ::/0           reject
local       all          all                      scram-sha-256
hostssl     all          all       127.0.0.1/32   scram-sha-256
hostssl     all          all       ::1/128        scram-sha-256
# Peers on the container's own network(s) only; tighten to the real client
# CIDR in a deployment.
hostssl     all          all       samenet        scram-sha-256
