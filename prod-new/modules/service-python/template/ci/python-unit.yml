# python-unit.yml -- CI for this Python unit. Single-repo layout: copy it to
# .github/workflows/python-unit.yml (the assembler places ci/** under the unit; GitHub only
# runs workflows from .github/workflows). Monorepo layout: the root workflow calls it as a
# reusable workflow with `working-directory: services/<SERVICE>`. The `paths` filters below
# are relative to the unit root: a monorepo root adds the prefix in its own trigger.
# No secrets are used or referenced.
name: python-unit

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "gates/**"
      - "observability/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Makefile"
      - "unit.mk"
      - "ci/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "gates/**"
      - "observability/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Makefile"
      - "unit.mk"
      - "ci/**"
  schedule:
    # Nightly: new advisories appear without any code change.
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      working-directory:
        description: "directory of the unit relative to the repository root"
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  check-fast:
    # Required check: the cheap presubmit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: install uv (pinned version)
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --disable-pip-version-check "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory || '.')) }}
      - run: make check-fast

  verify:
    # Everything gated: check-fast + lock consistency + dependency audit (network, fails
    # closed) + the property tests in the derandomised profile.
    if: github.event_name != 'schedule'
    needs: check-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: install uv (pinned version)
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --disable-pip-version-check "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles(format('{0}/uv.lock', inputs.working-directory || '.')) }}
      - run: make verify

  nightly:
    # Scheduled: the audit alone against today's advisory database. Mutation testing is not
    # wired (no mutation tool is in the locked set yet; see README, "Gates").
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: install uv (pinned version)
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --disable-pip-version-check "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
      - run: make audit
