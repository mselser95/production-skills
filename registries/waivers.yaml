# waivers registry — liability entries with owner + expiry.
#
# EXPLICITLY EMPTY, not unwritten. check-registries.sh distinguishes the two:
# four files present and each carrying an `entries:` key is a repo saying "I
# have none" (checked-and-none); a missing file is a repo that said nothing.
#
# Every entry: {id, obligation, owner, created, expires, reason}.
# `expires: never` is the one legal non-date value.
entries:
  - id: pg19-reevaluate
    obligation: "Re-evaluate PostgreSQL 19 as the default database major (db-postgres image pin)"
    owner: "@mselser95"
    created: 2026-11-27
    expires: 2027-05-31
    reason: "PostgreSQL 18 is pinned on purpose. Retire when TimescaleDB declares PostgreSQL 19 support AND a 19.x minor >= 19.1 exists; then bump prod-new/modules/db-postgres/db/image.lock and its major check."
