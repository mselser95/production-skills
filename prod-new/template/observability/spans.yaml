# Checked-in manifest of every tracing span this service emits.
#
# Contract: internal/app's TestSpansYAML_MatchesLedgerSpanNames diffs this
# file against the real `l.spanStart(...)` call sites in
# internal/app/ledger.go, in both directions -- adding or renaming a span in
# code without updating this file fails that test.
#
# A span fires only when a real Tracer is wired (Config.Tracing != "off",
# the default) -- see internal/platform/observability.
#
# PROPAGATION IS NOT LISTED HERE, and the omission is deliberate rather than an
# oversight: this file names spans, and a span is not a trace. What makes the
# two spans of one causal chain ONE trace is
# internal/platform/observability/propagation.go plus the traceparent the event
# log persists with every fact -- neither of which emits a span of its own.
# The end-to-end guard is cmd/<SERVICE>'s
# TestTracePropagation_ACommandAndItsPublicationShareOneTrace, and the
# production.yaml `driven:` block names the installer so a deployment that
# stopped propagating fails the standard's own probe.

- name: svc.deposit
  emitted_by: internal/app/ledger.go (Ledger.Deposit -> process)
  attrs: [event_type]
  note: >
    Wraps the full command pipeline: journal append, domain.Apply, and the
    outbox handoff for the resulting effect. RecordError is called with the
    first stage that failed, if any.

- name: svc.withdraw
  emitted_by: internal/app/ledger.go (Ledger.Withdraw -> process)
  attrs: [event_type]
  note: Same pipeline as svc.deposit, for the withdrawal command.
